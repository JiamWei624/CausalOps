<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310"><rect width="1100" height="310" fill="#f4f7f7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#2b716a"/></marker></defs><g font-family="Microsoft YaHei, sans-serif"><text x="30" y="39" fill="#1d4544" font-size="21" font-weight="bold">受限五步研究执行 · 当前实现</text><text x="30" y="73" fill="#506c6a" font-size="15">整体审核绑定数据、合同、计划及配置；正式统计步骤分别重验授权</text><rect x="30" y="111" width="190" height="94" rx="7" fill="white" stroke="#99c2bc"/><text x="43" y="143" font-size="17" fill="#155e58" font-weight="bold">数据与设计审计</text><text x="43" y="176" font-size="12" fill="#506c6a">字段、两组、窗口与设计依据</text><path d="M221 158 H237" stroke="#2b716a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="242" y="111" width="190" height="94" rx="7" fill="white" stroke="#99c2bc"/><text x="255" y="143" font-size="17" fill="#155e58" font-weight="bold">分组描述统计</text><text x="255" y="176" font-size="12" fill="#506c6a">原工具生成独立 Run</text><path d="M433 158 H449" stroke="#2b716a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="454" y="111" width="190" height="94" rx="7" fill="white" stroke="#99c2bc"/><text x="467" y="143" font-size="17" fill="#155e58" font-weight="bold">上游证据核验</text><text x="467" y="176" font-size="12" fill="#506c6a">读取已保存 Run、样本与哈希</text><path d="M645 158 H661" stroke="#2b716a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="666" y="111" width="190" height="94" rx="7" fill="white" stroke="#99c2bc"/><text x="679" y="143" font-size="17" fill="#155e58" font-weight="bold">A/B 效果分析</text><text x="679" y="176" font-size="12" fill="#506c6a">重验授权后生成独立 Run</text><path d="M857 158 H873" stroke="#2b716a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="878" y="111" width="190" height="94" rx="7" fill="white" stroke="#99c2bc"/><text x="891" y="143" font-size="17" fill="#155e58" font-weight="bold">报告整合</text><text x="891" y="176" font-size="12" fill="#506c6a">两次运行的结果与来源一致</text><text x="30" y="249" font-size="15" fill="#795a36">上游失败、证据冲突或批准失效：停止下游，保留已有 Run；不以显著性决定继续</text><text x="30" y="279" font-size="14" fill="#506c6a">两个统计调用。审计、证据核验和报告整合不伪装为统计 Run；模型自主规划关闭。</text></g></svg>