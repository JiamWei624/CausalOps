<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CausalOps 主动诊断 · 低保真设计</title><style>
:root{--ink:#203c3e;--muted:#6b7e80;--line:#d9e3e2;--green:#166d65;--bg:#f3f6f6;--amber:#94642a;--red:#a44139}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 "Microsoft YaHei",system-ui,sans-serif}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:8px 13px}button:hover{border-color:var(--green)}button:focus-visible,a:focus-visible{outline:3px solid #5aafa6;outline-offset:2px}.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--green)}.side{position:fixed;inset:0 auto 0 0;width:196px;padding:30px 20px;background:#edf2f1;border-right:1px solid var(--line)}.brand{font-size:21px;font-weight:700;margin:0 0 7px}.side p{color:var(--muted);font-size:12px}.nav{margin:35px 0}.nav div{padding:10px 8px;margin:4px 0}.nav .current{background:#dcebe7;color:var(--green);border-radius:5px;font-weight:700}.side .foot{position:absolute;bottom:24px;left:20px;right:20px;font-size:11px;color:var(--muted)}main{margin-left:196px;padding:24px 32px 40px;max-width:1510px}.notice{background:#fff5de;border:1px solid #ecd8ac;border-radius:6px;padding:11px 15px;font-size:13px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:25px 0 10px}.top h1{font-size:25px;margin:0}.sub{color:var(--muted);font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 20px}.tabs [aria-selected=true]{color:var(--green);background:#e6f1ee;border-color:#80b6ad}.card{background:white;border:1px solid var(--line);border-radius:9px;padding:22px;margin:16px 0}.card h2{font-size:18px;margin:0 0 12px}.number{color:var(--green);font-size:25px;font-weight:700;line-height:1.5}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;padding:16px 0 4px}.metrics>div{border-left:3px solid #d3e6df;padding-left:13px}.metrics .label{font-size:12px;color:var(--muted)}.scope{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:12px;margin:0 0 12px;overflow-wrap:anywhere}.result-note{font-size:13px;margin:14px 0 0}.blocked{border-left:4px solid var(--red);background:#fff7f5;padding:14px;margin:10px 0}.unknown{border-left:4px solid #c18f42;background:#fff9ee;padding:14px;margin:10px 0}.counts{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 18px}.count{padding:6px 10px;background:#f2f6f5;border-radius:4px;font-size:12px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}th{text-align:left;background:#f5f8f7;color:#57706d;font-weight:500}th,td{padding:11px 9px;border-bottom:1px solid #e4ebea;vertical-align:top}td:first-child{width:25%}.tag{display:inline-block;font-size:11px;white-space:nowrap;padding:2px 7px;border-radius:4px;background:#edf2f1;color:#4c6663}.verified{background:#e7f2ed;color:#286c53}.issue{background:#fcebe7;color:var(--red)}.unknown-tag{background:#fff1d9;color:var(--amber)}.muted{color:var(--muted)}.origin{font-size:11px;color:var(--muted)}.bottom-note{font-size:12px;color:var(--muted);margin:15px 0 0}.action{border:1px solid var(--line);padding:16px;border-radius:6px;margin:12px 0}.action h3{font-size:15px;margin:0 0 7px}.action p{margin:6px 0}.action .buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:15px;background:#f7faf8;color:#4a6861}.events{font-size:12px;background:#f6f8f7;padding:12px;margin-top:12px}.feedback{background:#e9f3ee;padding:12px;color:#286a55;margin:12px 0}.draft{border:1px dashed #9cbeb6;padding:14px;margin-top:12px}.footer{font-size:12px;color:var(--muted);padding:12px 0}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:9px;padding:24px;max-width:650px;width:calc(100vw - 32px);max-height:87vh;color:var(--ink);line-height:1.8;overflow:auto}dialog::backdrop{background:#173b3b6b}dialog h2{font-size:19px;margin:0 0 13px}dl{margin:10px 0}dt{font-size:12px;color:var(--muted);margin-top:12px}dd{margin:2px 0;overflow-wrap:anywhere}.dialog-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.check{display:flex;gap:9px;align-items:flex-start;margin-top:17px}.check input{margin-top:7px}.mock{font-size:11px;padding:3px 7px;border:1px solid #c2d8d2;border-radius:4px;color:var(--green);white-space:nowrap}@media(max-width:1050px){.side{width:166px}main{margin-left:166px;padding:20px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.side{display:none}main{margin-left:0;padding:14px}.top h1{font-size:21px}.card{padding:15px}.top{align-items:flex-start}.mock{display:none}.metrics{gap:14px}.number{font-size:21px}table{min-width:0}thead{display:none}tbody,tr,td{display:block;width:100%}td:first-child{width:100%}tr{border-bottom:1px solid var(--line);padding:10px 0}td{border:0;padding:5px 2px}td .origin{display:inline-block;margin-left:6px}}
</style></head><body><aside class="side"><div class="brand">CausalOps</div><p>研究工作台 · 产品设计</p><div class="nav"><div>首页</div><div>我的研究</div><div class="current">自动化研究</div><div>分析示例</div><div>研究记录</div></div><div class="foot">单用户本地 Beta<br>本页为尚未实现的低保真原型</div></aside><main><div class="notice"><b>设计原型 · 尚未实现</b>　A/B/C均为交互示意，不连接工作区，不产生诊断、批准或统计运行。A展示历史公开验收数字，不代表本轮新测。</div><header class="top"><div><h1>研究结果与证据评估</h1><div class="sub">原结果只读保留 · 检查状态、研究声明与建议分别展示</div></div><span class="mock">模型解释默认关闭</span></header><div class="tabs" role="tablist" aria-label="设计场景"><button role="tab" aria-selected="true" data-case="A">A · 固定目标可回答</button><button role="tab" aria-selected="false" data-case="B">B · 设计依据不足</button><button role="tab" aria-selected="false" data-case="C">C · 运行引用冲突</button></div><section id="content"></section><footer class="footer">本原型只验证信息结构和交互表达，不证明产品功能已经开发。<a href="../PRD.md">完整专项PRD</a> · <a href="../RULES.md">诊断规则</a> · <a href="../../../../README.md">已发布Beta说明</a></footer></main><dialog id="evidence"><h2>诊断依据</h2><div id="evidence-body"></div><div class="dialog-foot"><button onclick="document.querySelector('#evidence').close()">关闭</button></div></dialog><dialog id="accept"><h2>登记下一步事项</h2><div id="accept-body"></div><label class="check"><input type="checkbox" id="ack"><span>我理解这只登记建议或需求草案，不是批准，也不会执行统计；正式研究变更仍需重新审核。</span></label><div class="dialog-foot"><button onclick="document.querySelector('#accept').close()">取消</button><button class="primary" id="confirm" disabled>确认登记（原型）</button></div></dialog>
<script>
const statuses={verified:'已核验满足',issue:'已发现问题',unknown:'条件未知或证据不足',not_applicable:'不适用',not_checked:'尚未检查'};const level={critical:'停止整合',major:'需补充依据',moderate:'研究关注项',information:'说明'};
const cases={A:{title:'公开营销实验 · 设计示意A',id:'示意任务A',state:'固定目标已交付，按已确认范围解释',rows:[['数据与两个运行范围一致','verified','program_fact','information','已保存的审计、两份工具结果和批准引用属于同一任务/计划/数据。','程序核对已保存引用，不重新计算统计。'],['分配设计来源记录','verified','human_declaration','information','公开实验说明与人工来源核对记录一致。','核验的是来源登记与声明，不是程序证明随机分配。'],['基线协变量平衡','not_checked','program_fact','information','本固定分析未指定基线协变量，已有诊断标记未实施检查。','不等于完全平衡，也不能据此认定随机化失败。'],['无干扰与长期外推','not_checked','program_fact','information','当前没有验证全部识别假设或长期利润的数据产物。','结果仅覆盖该实验两组客户分配后两周访问。']],actions:[]},B:{title:'研究条件预诊断 · 设计示意B',id:'示意任务B',state:'随机分配依据未确认',rows:[['两组字段及已登记口径','verified','program_fact','information','仅说明存在可读字段，不推断分配机制。','这是合同与字段核对，不是A/B执行。'],['随机分配设计来源','unknown','human_declaration','major','缺少可追溯设计来源和人工核对记录。','不能从组名或组间均衡推断随机分配。'],['A/B数值与区间','not_checked','program_fact','information','没有正式方案、批准或已执行A/B Run。','不引用场景A的示例数值，不创建计算计划。'],['基线平衡','not_checked','program_fact','information','没有相应检查产物。','不补0，不显示通过。']],actions:[{title:'补充分配设计依据',why:'确认哪些研究资料支持分配机制，而不是根据字段名称判断。',data:'公开设计说明、来源关联和人工核对记录',plan:'本操作只登记材料请求；若正式合同改变，原批准失效，新研究另行审核。',draft:false}]},C:{title:'整体结果整合核查 · 设计示意C',id:'示意任务C',state:'整合结论暂不可用',rows:[['所选运行的计划来源','issue','program_fact','critical','所选运行引用不属于当前计划；不展示其他任务信息。','即使两次数字相同，也不能作为同一报告证据。'],['有效原始结果保留','verified','program_fact','information','各任务自身合法结果仍可分别只读查看。','不覆盖历史，也不从对方运行取数补齐当前报告。'],['本次双Run整合','not_checked','program_fact','information','冲突消除前，不生成新的联合结论。','保持原审批和执行门禁。'],['观察窗口核对','verified','program_fact','information','仅使用各运行自己登记的窗口；没有重新解释日期含义。','新窗口若没有对应数据，必须说明缺少条件。']],actions:[{title:'核对运行选择与研究范围',why:'先恢复同一任务、计划与窗口的证据引用，再判断是否需要新研究。',data:'当前任务原生运行引用及版本',plan:'仅登记核对需求。需要新数据/窗口时创建受支持的待审方案，不沿用旧批准。',draft:true}]}};
let current='A',events={A:[],B:[],C:[]},feedback={};const origin={program_fact:'程序事实',human_declaration:'人工声明核对'};const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const c=cases[current],count=Object.keys(statuses).map(k=>`<span class="count">${statuses[k]} ${c.rows.filter(r=>r[1]===k).length}</span>`).join('');let first=current==='A'?`<div class="metrics"><div><div class="label">男装邮件组访问率</div><div class="number">18.28%</div></div><div><div class="label">未发邮件组访问率</div><div class="number">10.62%</div></div><div><div class="label">绝对差异</div><div class="number">7.66 <small>个百分点</small></div></div><div><div class="label">原95%区间 · 百分点</div><div class="number" style="font-size:20px">[6.995, 8.323]</div></div></div><p class="result-note">历史公开验收数值用于排版示意。分析单位为客户，纳入42,613人，采用原独立组均值差与原正态近似区间。</p><div class="scope" style="border:0;margin-top:9px">来源：示意描述Run、示意A/B Run与原报告引用；生产功能必须解析真实ID。</div>`:current==='B'?'<div class="unknown"><b>尚无已执行的A/B结果</b><br>当前仅检查研究条件。存在处理/对照字段不能确认随机化；未创建正式Plan或执行统计。</div>':'<div class="blocked"><b>先核对证据，暂停整体结论展示</b><br>当前运行引用与任务计划不一致。合法历史结果保留，不能把其他运行的数字拼入本报告。</div>';
const table=c.rows.map((r,i)=>`<tr><td><b>${escape(r[0])}</b><div class="origin">${origin[r[2]]}</div></td><td><span class="tag ${r[1]==='unknown'?'unknown-tag':r[1]}">${statuses[r[1]]}</span><div class="origin">${level[r[3]]}</div></td><td>${escape(r[4])}</td><td><button data-evidence="${i}" aria-label="查看依据：${escape(r[0])}">查看依据</button></td></tr>`).join('');
const actions=c.actions.length?c.actions.map((a,i)=>`<div class="action"><h3>${escape(a.title)}</h3><p>${escape(a.why)}</p><div class="sub">需补充：${escape(a.data)}</div><p class="sub">${escape(a.plan)}</p><div class="buttons"><button class="primary" data-accept="${i}">采纳建议</button><button data-defer="${i}">暂不处理</button></div></div>`).join(''):'<div class="empty">当前固定目标已有结果，没有需要立即追加的统计分析。未检查的假设保留说明，不为数量新增风险或方法。</div>';
const e=events[current].length?'<div class="events"><b>原型内事件示意</b><br>'+events[current].map(x=>escape(x)).join('<br>')+'</div>':'';
document.querySelector('#content').innerHTML=`<article class="card"><h2>第一层 · 本次研究结果</h2><p class="scope">${escape(c.title)}　|　${c.id}　|　客户 / 两周访问率　|　${current==='B'?'尚无正式计划':'计划版本1（示意）'}</p><div class="legend"><b>${escape(c.state)}</b></div>${first}</article><article class="card"><h2>第二层 · 证据质量</h2><div class="legend"><span>程序事实</span><span>人工声明</span><span>模型建议须另行标注，当前未调用</span></div><div class="counts">${count}</div><div class="table-wrap"><table><thead><tr><th>检查项目与来源</th><th>状态与影响</th><th>依据摘要</th><th>操作</th></tr></thead><tbody>${table}</tbody></table></div><p class="bottom-note">仅展示代表性检查，不是14项规则的实际执行统计。已核验满足的范围限于该条规则；未检查、不适用和人工声明都不等于因果假设获证。</p></article><article class="card"><h2>第三层 · 下一步研究建议</h2><div class="sub">最多3项；查看/采纳/暂缓均不授予执行权限。</div>${feedback[current]?'<div class="feedback">'+escape(feedback[current])+'</div>':''}${actions}${events[current].some(x=>x.includes('需求草案'))?'<div class="draft"><b>研究需求草案 · 尚未审核</b><br>先核对证据范围；如需新指标、窗口、样本或方法，须通过受支持方案入口重新审核。当前不执行。</div>':''}${e}</article>`;
document.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>evidence(Number(b.dataset.evidence)));document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>accept(Number(b.dataset.accept)));document.querySelectorAll('[data-defer]').forEach(b=>b.onclick=()=>{events[current].push('暂不处理：已记录延期（仅原型），原诊断状态与结论限制保留。');feedback[current]='已暂缓建议；这不解除证据限制。';render()});}
function evidence(i){const r=cases[current].rows[i];document.querySelector('#evidence-body').innerHTML=`<div class="notice">仅为设计示意；这些引用不是可供执行的生产记录。</div><dl><dt>检查项目</dt><dd>${escape(r[0])}</dd><dt>来源与规则</dt><dd>${origin[r[2]]} · hillstrom-diagnostics-v1（拟定规则包）</dd><dt>检查状态</dt><dd>${statuses[r[1]]} · ${level[r[3]]}</dd><dt>可核对依据</dt><dd>${escape(r[4])}</dd><dt>对结论的影响</dt><dd>${escape(r[5])}</dd><dt>引用边界</dt><dd>${cases[current].id} / 当前示意合同与原生运行引用。生产服务必须先验证所有权、版本及内容hash。</dd></dl>`;document.querySelector('#evidence').showModal()}
let accepting=0;function accept(i){accepting=i;const a=cases[current].actions[i];document.querySelector('#accept-body').innerHTML=`<p><b>${escape(a.title)}</b></p><p>${escape(a.plan)}</p><div class="notice">${a.draft?'只创建研究需求草案，不创建已批准方案。':'只创建材料补充事项，不确认随机化，也不批准统计。'}</div>`;document.querySelector('#ack').checked=false;document.querySelector('#confirm').disabled=true;document.querySelector('#accept').showModal()}
document.querySelector('#ack').onchange=e=>document.querySelector('#confirm').disabled=!e.target.checked;document.querySelector('#confirm').onclick=()=>{const a=cases[current].actions[accepting];events[current].push(a.draft?'已登记研究需求草案（仅原型），尚未审核、未执行。':'已登记材料补充事项（仅原型），未修改合同、未批准、未执行。');feedback[current]='已登记。后续正式研究变更仍须新版本和人工审核。';document.querySelector('#accept').close();render()};document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{current=b.dataset.case;document.querySelectorAll('[data-case]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));render()});render();
</script></body></html>
