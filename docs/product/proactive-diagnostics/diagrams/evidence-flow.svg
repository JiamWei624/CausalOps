<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="440" viewBox="0 0 1170 440"><rect width="1170" height="440" fill="#f3f6f5"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#28756b"/></marker></defs><g font-family="Microsoft YaHei,sans-serif"><text x="30" y="39" fill="#194b45" font-size="21" font-weight="bold">主动研究诊断 · 拟实现的证据流与权限边界</text><text x="30" y="70" fill="#687c77" font-size="14">设计图，尚未实现。诊断派生于已有证据，不成为新的统计事实来源。</text><rect x="30" y="104" width="343" height="188" rx="8" fill="white" stroke="#b1cbc4"/><rect x="30" y="104" width="343" height="46" rx="8" fill="#e4efeb"/><text x="47" y="134" fill="#1a665b" font-size="18" font-weight="bold">原有事实与声明</text><text x="47" y="184" fill="#375a50" font-size="15">DataContract / 来源核对记录</text><text x="47" y="220" fill="#375a50" font-size="15">审计与两份真实统计Run</text><text x="47" y="256" fill="#375a50" font-size="15">工具诊断 / 原报告 / 方法卡</text><path d="M377 200 H407" stroke="#28756b" stroke-width="1.7" marker-end="url(#a)"/><rect x="413" y="104" width="343" height="188" rx="8" fill="white" stroke="#b1cbc4"/><rect x="413" y="104" width="343" height="46" rx="8" fill="#e4efeb"/><text x="430" y="134" fill="#1a665b" font-size="18" font-weight="bold">新增只读评估</text><text x="430" y="184" fill="#375a50" font-size="15">所有权、版本和内容核验</text><text x="430" y="220" fill="#375a50" font-size="15">规则适用性与五态Finding</text><text x="430" y="256" fill="#375a50" font-size="15">结论限制与有限行动候选</text><path d="M760 200 H790" stroke="#28756b" stroke-width="1.7" marker-end="url(#a)"/><rect x="796" y="104" width="343" height="188" rx="8" fill="white" stroke="#b1cbc4"/><rect x="796" y="104" width="343" height="46" rx="8" fill="#e4efeb"/><text x="813" y="134" fill="#1a665b" font-size="18" font-weight="bold">三层报告与研究决定</text><text x="813" y="184" fill="#375a50" font-size="15">结果：只引用原运行数值</text><text x="813" y="220" fill="#375a50" font-size="15">证据：来源、未知和未检查</text><text x="813" y="256" fill="#375a50" font-size="15">建议：用户采纳或暂缓</text><rect x="30" y="323" width="1109" height="80" rx="7" fill="white" stroke="#ba9a69" stroke-dasharray="5 4"/><text x="49" y="354" fill="#805d2b" font-size="16">采纳仅登记补充事项或研究需求草案；正式研究变更仍进入原有Plan与人工审批</text><text x="49" y="382" fill="#687c77" font-size="14">诊断与模型没有批准/执行权。未知不等于通过；冲突不允许拼接数值；历史Run保持不变。</text></g></svg>