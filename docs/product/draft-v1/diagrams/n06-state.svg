<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-labelledby="title"><title id="title">N06 预览与正式研究的状态边界</title><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203b42} .title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#526974}.label{font-size:17px;font-weight:700}.body{font-size:14px}.note{font-size:13px;fill:#526974} .box{fill:white;stroke:#b8ced0;stroke-width:1.4}.arrow{stroke:#377c78;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#377c78"/></marker></defs><rect width="1160" height="760" fill="#f5f8f9"/><text x="36" y="44" class="title">指标变更：预览状态与正式研究分离</text><text x="36" y="72" class="sub">现有 V2.2 本地迭代 · 新候选需要单独审核 · 旧运行保持可查</text>
<rect x="28" y="108" width="370" height="581" rx="10" fill="#e7f0ee"/><text x="48" y="141" class="label">预览层：仅查看分布</text>
<rect class="box" x="48" y="170" width="330" height="116" rx="8"/><text class="label" x="66" y="199">当前预览字段</text><text class="body" x="66" y="226">用户切换字段，仅更新预览图</text><text class="body" x="66" y="249">不写入已批准 Plan / Approval / Run</text>
<rect class="box" x="48" y="350" width="330" height="116" rx="8"/><text class="label" x="66" y="379">显示差异与明确入口</text><text class="body" x="66" y="406">当前预览 · 正式指标 · 方案版本</text><text class="body" x="66" y="429">明确选择“生成指标变更方案”</text>
<path class="arrow" d="M213 286 V350"/>
<text x="48" y="513" class="body">只看预览：正式研究保持不变。</text><text x="48" y="544" class="body">刷新可能恢复默认预览；</text><text x="48" y="569" class="body">正式指标按保存的研究版本显示。</text>
<text x="443" y="141" class="label">正式研究层：版本、审批与运行</text>
<rect class="box" x="445" y="170" width="304" height="116" rx="8"/><text class="label" x="463" y="199">原方案与历史运行</text><text class="body" x="463" y="226">指标 A · 版本 Vn · 批准 An</text><text class="body" x="463" y="249">历史报告保持不可变</text>
<rect class="box" x="445" y="350" width="304" height="116" rx="8"/><text class="label" x="463" y="379">新候选方案</text><text class="body" x="463" y="406">指标 B · 版本 Vn+1</text><text class="body" x="463" y="429">核对窗口、字段和必要条件</text>
<rect class="box" x="817" y="350" width="304" height="116" rx="8"/><text class="label" x="835" y="379">新版本审核与批准</text><text class="body" x="835" y="406">条件不足 → 说明并停留待审</text><text class="body" x="835" y="429">不自动勾选或执行</text>
<rect class="box" x="817" y="548" width="304" height="116" rx="8"/><text class="label" x="835" y="577">新运行与新报告</text><text class="body" x="835" y="604">指标 B · 新 Run · 新批准依据</text><text class="body" x="835" y="627">刷新后仍可核对，亦可查旧报告</text>
<path class="arrow" d="M378 408 H445"/><path class="arrow" d="M749 408 H817"/><path class="arrow" d="M969 466 V548"/><path class="arrow" d="M597 286 V350"/>
<path d="M749 225 H1132 V606 H1121" fill="none" stroke="#869ca4" stroke-width="1.5" stroke-dasharray="6 5"/><text x="817" y="215" class="note">历史入口保持可查</text>
<text x="445" y="591" class="body">安全边界：</text><text x="445" y="618" class="body">旧批准不能执行新方案。</text><text x="445" y="645" class="body">数值相同也不能混用字段或单位。</text>
<text x="36" y="727" class="note">依据：ui/onboarding.py、ui/report_target.py 与 V2.2 阶段总结。图示为规则解释，不是产品截图。</text></svg>