<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img" aria-labelledby="title"><title id="title">CausalOps 用户研究流程与职责</title><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203b42} .title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#526974}.label{font-size:17px;font-weight:700}.body{font-size:14px}.note{font-size:13px;fill:#526974} .box{fill:white;stroke:#b8ced0;stroke-width:1.4}.arrow{stroke:#377c78;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#377c78"/></marker></defs><rect width="1160" height="690" fill="#f5f8f9"/><text x="36" y="44" class="title">研究任务流程与职责</text><text x="36" y="72" class="sub">现有单用户本地工作台 · 用户确认研究事实，系统保存可核查过程</text>
<rect x="24" y="102" width="1112" height="49" rx="5" fill="#dcece9"/>
<text x="44" y="134" class="label">使用者：提出目标与审核</text><text x="414" y="134" class="label">工作台：组织方案与证据</text><text x="788" y="134" class="label">运行与结果：计算、保存、查阅</text>
<rect class="box" x="36" y="175" width="318" height="116" rx="8"/><text class="label" x="54" y="204">1  导入与理解数据</text><text class="body" x="54" y="231">查看本地概况，明确问题与口径</text><text class="body" x="54" y="254">预览字段不等于正式研究指标</text>
<rect class="box" x="421" y="175" width="318" height="116" rx="8"/><text class="label" x="439" y="204">2  生成候选方案</text><text class="body" x="439" y="231">模型辅助可选；资料与条件可查</text><text class="body" x="439" y="254">信息不足 → 具体澄清</text>
<rect class="box" x="36" y="345" width="318" height="116" rx="8"/><text class="label" x="54" y="374">3  人工核对与批准</text><text class="body" x="54" y="401">查看目标、方法、指标、窗口及版本</text><text class="body" x="54" y="424">不满足条件 → 返回澄清或修订</text>
<rect class="box" x="421" y="345" width="318" height="116" rx="8"/><text class="label" x="439" y="374">4  检查执行权限</text><text class="body" x="439" y="401">校验批准、数据与方案绑定</text><text class="body" x="439" y="424">版本失效 / 条件不符 → 阻断</text>
<rect class="box" x="805" y="345" width="318" height="116" rx="8"/><text class="label" x="823" y="374">5  执行并保存运行</text><text class="body" x="823" y="401">注册工具计算；结果绑定 Run</text><text class="body" x="823" y="424">新计算不覆盖历史报告</text>
<rect class="box" x="805" y="175" width="318" height="116" rx="8"/><text class="label" x="823" y="204">6  查看报告与追问</text><text class="body" x="823" y="231">先交付结论，再查看来源与限制</text><text class="body" x="823" y="254">只读解释 → 使用选定运行证据</text>
<path class="arrow" d="M354 233 H421"/><path class="arrow" d="M580 291 V318 H195 V345"/><path class="arrow" d="M354 403 H421"/><path class="arrow" d="M739 403 H805"/><path class="arrow" d="M964 345 V291"/>
<path class="arrow" d="M964 175 V158 H580 V175"/><text x="746" y="154" class="note">明确修改 → 新候选</text>
<rect x="36" y="501" width="1087" height="135" rx="8" fill="#edf3f5"/><text class="label" x="56" y="533">两个验收对象必须区分</text><text class="body" x="56" y="563">流程能完成：用户有入口、版本和批准一致、统计结果可追溯。</text><text class="body" x="56" y="589">研究答复正确：目标、指标、单位、窗口和解释均符合问题；当前复杂任务仍有失败。</text><text class="note" x="56" y="615">依据：总体 PRD、现有架构与 V2.3 结项。此图不是未来自主科研能力承诺。</text></svg>