<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-label="执行状态与恢复边界"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#638c80"/></marker></defs><rect width="100%" height="100%" fill="#f7faf8"/><g font-family="Microsoft YaHei, sans-serif"><text x="30" y="38" font-size="23" fill="#244641" font-weight="bold">执行状态与恢复边界</text><text x="30" y="66" font-size="13" fill="#244641" font-weight="normal">自动化 V2 · 设计稿，尚未实现</text><rect x="30" y="110" width="210" height="80" rx="6" fill="#ffffff" stroke="#a9c4bc"/><text x="46" y="139" font-size="16" fill="#244641" font-weight="normal">预检 / 澄清</text><text x="46" y="163" font-size="13" fill="#244641" font-weight="normal">明确数据与条件</text> <rect x="270" y="110" width="210" height="80" rx="6" fill="#ffffff" stroke="#a9c4bc"/><text x="286" y="139" font-size="16" fill="#244641" font-weight="normal">候选 / 待审核</text><text x="286" y="163" font-size="13" fill="#244641" font-weight="normal">整个计划固定</text> <rect x="510" y="110" width="210" height="80" rx="6" fill="#ffffff" stroke="#a9c4bc"/><text x="526" y="139" font-size="16" fill="#244641" font-weight="normal">已批准</text><text x="526" y="163" font-size="13" fill="#244641" font-weight="normal">逐步验证权限</text> <rect x="750" y="110" width="210" height="80" rx="6" fill="#ffffff" stroke="#a9c4bc"/><text x="766" y="139" font-size="16" fill="#244641" font-weight="normal">运行中</text><text x="766" y="163" font-size="13" fill="#244641" font-weight="normal">证据与预算检查</text> <path d="M240,150 L270,150" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <path d="M480,150 L510,150" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <path d="M720,150 L750,150" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <path d="M855,190 L855,240" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <rect x="750" y="240" width="210" height="72" rx="6" fill="#e5f1ec" stroke="#a9c4bc"/><text x="766" y="269" font-size="16" fill="#244641" font-weight="normal">完成</text><text x="766" y="293" font-size="13" fill="#244641" font-weight="normal">全部必要证据齐全</text> <rect x="30" y="265" width="210" height="80" rx="6" fill="#fff6e6" stroke="#a9c4bc"/><text x="46" y="294" font-size="16" fill="#244641" font-weight="normal">暂停 / 中断</text><text x="46" y="318" font-size="13" fill="#244641" font-weight="normal">保留在途证据</text> <rect x="270" y="265" width="210" height="80" rx="6" fill="#fff6e6" stroke="#a9c4bc"/><text x="286" y="294" font-size="16" fill="#244641" font-weight="normal">执行失败</text><text x="286" y="318" font-size="13" fill="#244641" font-weight="normal">不无限重试</text> <rect x="510" y="265" width="210" height="80" rx="6" fill="#fff6e6" stroke="#a9c4bc"/><text x="526" y="294" font-size="16" fill="#244641" font-weight="normal">安全阻断</text><text x="526" y="318" font-size="13" fill="#244641" font-weight="normal">条件或授权冲突</text> <path d="M750,170 L730,170 L730,220 L135,220 L135,265" fill="none" stroke="#638c80" marker-end="url(#arr)"/> <path d="M135,345 L135,400" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <path d="M375,345 L375,400" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <rect x="30" y="400" width="450" height="85" rx="6" fill="#ffffff" stroke="#a9c4bc"/><text x="46" y="429" font-size="16" fill="#244641" font-weight="normal">人工确认恢复 → 证据调和</text><text x="46" y="453" font-size="13" fill="#244641" font-weight="normal">原批准有效且结果唯一才继续；否则停止</text> <rect x="510" y="400" width="450" height="85" rx="6" fill="#ffffff" stroke="#a9c4bc"/><text x="526" y="429" font-size="16" fill="#244641" font-weight="normal">取消 → 当前任务终止</text><text x="526" y="453" font-size="13" fill="#244641" font-weight="normal">旧证据保留；重开为新任务并重新审核</text> <text x="30" y="535" font-size="14" fill="#244641" font-weight="normal">任务状态、步骤状态与后台Job状态分别保存；页面刷新不授予执行权限。</text> <text x="30" y="561" font-size="13" fill="#244641" font-weight="normal">完整转移（含恢复、重新候选）见同名 .mmd；图中突出关键状态族。</text></g></svg>