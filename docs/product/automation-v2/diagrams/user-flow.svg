<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-label="用户流程与步骤依赖"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#638c80"/></marker></defs><rect width="100%" height="100%" fill="#f7faf8"/><g font-family="Microsoft YaHei, sans-serif"><text x="30" y="38" font-size="23" fill="#244641" font-weight="bold">用户流程与步骤依赖</text><text x="30" y="66" font-size="13" fill="#244641" font-weight="normal">自动化 V2 · 设计稿，尚未实现</text><text x="30" y="104" font-size="15" fill="#244641" font-weight="bold">用户与规划</text> <rect x="30" y="120" width="220" height="76" rx="6" fill="#ffffff" stroke="#a9c4bc"/><text x="46" y="149" font-size="16" fill="#244641" font-weight="normal">明确目标</text><text x="46" y="173" font-size="13" fill="#244641" font-weight="normal">单表 / 两周访问率</text> <rect x="280" y="120" width="220" height="76" rx="6" fill="#ffffff" stroke="#a9c4bc"/><text x="296" y="149" font-size="16" fill="#244641" font-weight="normal">预检与来源确认</text><text x="296" y="173" font-size="13" fill="#244641" font-weight="normal">只读，不生成统计Run</text> <rect x="530" y="120" width="220" height="76" rx="6" fill="#ffffff" stroke="#a9c4bc"/><text x="546" y="149" font-size="16" fill="#244641" font-weight="normal">有限研究计划</text><text x="546" y="173" font-size="13" fill="#244641" font-weight="normal">模型可选 / 固定范围</text> <rect x="780" y="120" width="220" height="76" rx="6" fill="#ffffff" stroke="#a9c4bc"/><text x="796" y="149" font-size="16" fill="#244641" font-weight="normal">整体人工批准</text><text x="796" y="173" font-size="13" fill="#244641" font-weight="normal">绑定数据、步骤和预算</text> <path d="M250,157 L280,157" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <path d="M500,157 L530,157" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <path d="M750,157 L780,157" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <text x="30" y="245" font-size="17" fill="#244641" font-weight="bold">批准后的真实依赖：5个逻辑步骤，2次统计调用</text> <rect x="30" y="270" width="180" height="90" rx="6" fill="white" stroke="#a9c4bc"/><text x="46" y="299" font-size="16" fill="#244641" font-weight="normal">S01 审计</text><text x="46" y="323" font-size="13" fill="#244641" font-weight="normal">重新验证批准范围</text> <rect x="230" y="270" width="180" height="90" rx="6" fill="#e5f1ec" stroke="#a9c4bc"/><text x="246" y="299" font-size="16" fill="#244641" font-weight="normal">S02 描述统计</text><text x="246" y="323" font-size="13" fill="#244641" font-weight="normal">保存实际分组Run</text> <rect x="430" y="270" width="180" height="90" rx="6" fill="white" stroke="#a9c4bc"/><text x="446" y="299" font-size="16" fill="#244641" font-weight="normal">S03 证据门禁</text><text x="446" y="323" font-size="13" fill="#244641" font-weight="normal">读取S02样本与口径</text> <rect x="630" y="270" width="180" height="90" rx="6" fill="#e5f1ec" stroke="#a9c4bc"/><text x="646" y="299" font-size="16" fill="#244641" font-weight="normal">S04 A/B计算</text><text x="646" y="323" font-size="13" fill="#244641" font-weight="normal">只在门禁通过后调用</text> <rect x="830" y="270" width="180" height="90" rx="6" fill="white" stroke="#a9c4bc"/><text x="846" y="299" font-size="16" fill="#244641" font-weight="normal">S05 整合报告</text><text x="846" y="323" font-size="13" fill="#244641" font-weight="normal">核对两个Run及来源</text> <path d="M210,315 L230,315" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <path d="M410,315 L430,315" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <path d="M610,315 L630,315" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <path d="M810,315 L830,315" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <path d="M890,196 L890,220" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <text x="730" y="237" font-size="12" fill="#244641" font-weight="normal">按完整批准依次执行</text> <path d="M520,360 L520,410" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <rect x="350" y="410" width="340" height="74" rx="6" fill="#fff6e6" stroke="#a9c4bc"/><text x="366" y="439" font-size="16" fill="#244641" font-weight="normal">条件不足 / 证据不一致 → 停止</text><text x="366" y="463" font-size="13" fill="#244641" font-weight="normal">不换方法、不补事实、不继续下游</text> <text x="30" y="530" font-size="14" fill="#244641" font-weight="normal">绿色节点＝统计调用；其他节点＝只读核验或证据整合。人工批准不是统计步骤。</text></g></svg>