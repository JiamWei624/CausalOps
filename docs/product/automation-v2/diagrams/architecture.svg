<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="最小实现架构与复用边界"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#638c80"/></marker></defs><rect width="100%" height="100%" fill="#f7faf8"/><g font-family="Microsoft YaHei, sans-serif"><text x="30" y="38" font-size="23" fill="#244641" font-weight="bold">最小实现架构与复用边界</text><text x="30" y="66" font-size="13" fill="#244641" font-weight="normal">自动化 V2 · 设计稿，尚未实现</text><rect x="30" y="110" width="940" height="80" rx="6" fill="#ffffff" stroke="#a9c4bc"/><text x="46" y="139" font-size="16" fill="#244641" font-weight="normal">界面层 / 复用与扩展</text><text x="46" y="163" font-size="13" fill="#244641" font-weight="normal">Streamlit：目标、整体审核、进度、报告；BackgroundJobs：异步与恢复</text> <path d="M500,190 L500,220" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <rect x="30" y="220" width="940" height="80" rx="6" fill="#ffffff" stroke="#a9c4bc"/><text x="46" y="249" font-size="16" fill="#244641" font-weight="normal">服务与编排 / 复用与扩展</text><text x="46" y="273" font-size="13" fill="#244641" font-weight="normal">ResearchService → LangGraph：路由、检索、规划、审核中断</text> <path d="M500,300 L500,330" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <rect x="30" y="330" width="455" height="110" rx="6" fill="#e5f1ec" stroke="#a9c4bc"/><text x="46" y="359" font-size="16" fill="#244641" font-weight="normal">新增：BoundedCoordinator</text><text x="46" y="383" font-size="13" fill="#244641" font-weight="normal">固定依赖 / 逐步授权 / 失败停止</text><text x="46" y="407" font-size="13" fill="#244641" font-weight="normal">PlanV2、BudgetLedger、EvidenceAdapter</text> <rect x="515" y="330" width="455" height="110" rx="6" fill="#ffffff" stroke="#a9c4bc"/><text x="531" y="359" font-size="16" fill="#244641" font-weight="normal">复用：AnalysisTools / TaskRuntime</text><text x="531" y="383" font-size="13" fill="#244641" font-weight="normal">原统计工具、检查点、Run核对</text><text x="531" y="407" font-size="13" fill="#244641" font-weight="normal">descriptive / ab_test；不改估计器</text> <path d="M485,385 L515,385" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <path d="M745,440 L745,470" fill="none" stroke="#638c80" stroke-width="2" marker-end="url(#arr)"/> <rect x="30" y="470" width="940" height="85" rx="6" fill="#ffffff" stroke="#a9c4bc"/><text x="46" y="499" font-size="16" fill="#244641" font-weight="normal">证据层 / 复用存储＋新增引用清单</text><text x="46" y="523" font-size="13" fill="#244641" font-weight="normal">SQLite / Parquet / 原Run与ToolResult → ReportManifest → 页面与报告</text> <text x="30" y="595" font-size="14" fill="#244641" font-weight="normal">模型是可选规划与解释来源；不批准、不写研究事实、不拥有统计工具直接执行权限。</text></g></svg>