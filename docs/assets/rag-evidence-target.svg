<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">RAG 与运行证据 · 三类依据，各负其责</title><desc id="desc">拟用 LangChain 统一检索接口；保留现有来源登记与精确证据校验。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#607783"/></marker></defs><style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#23343e}.heading{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#52636e}.node{fill:#f0f7fa;stroke:#658b9d;stroke-width:1.5}.planned{fill:#fff8eb;stroke:#ae863f;stroke-width:1.5;stroke-dasharray:7 4}.title{font-size:21px;font-weight:600}.detail{font-size:17px;fill:#425763}.edge{fill:none;stroke:#607783;stroke-width:2;marker-end:url(#arrow)}.note{font-size:16px;fill:#536670}</style><rect width="1440" height="1080" fill="white"/><text x="50" y="53" class="heading">RAG 与运行证据 · 三类依据，各负其责</text><text x="50" y="88" class="subtitle">拟用 LangChain 统一检索接口；保留现有来源登记与精确证据校验。</text><path class="edge" d="M250 295 V390"/><path class="edge" d="M720 295 V390"/><path class="edge" d="M1190 295 V390"/><path class="edge" d="M485 540 V600 H600 V670"/><path class="edge" d="M1190 540 V600 H840 V670"/><path class="edge" d="M720 815 V900"/><rect x="50" y="150" width="400" height="145" rx="12" class="node"/><text x="68" y="182" class="title">方法资料</text><text x="68" y="214" class="detail">适用问题、数据要求、识别条件</text><text x="68" y="239" class="detail">诊断、失败情形、解释边界</text><text x="68" y="264" class="detail">官方资料与已核对文献范围</text><rect x="520" y="150" width="400" height="145" rx="12" class="planned"/><text x="538" y="182" class="title">业务口径与数据合同</text><text x="538" y="214" class="detail">字段、单位、粒度、时间窗口</text><text x="538" y="239" class="detail">来源与访问范围</text><text x="538" y="264" class="detail">人工确认与程序检查分别记录</text><rect x="990" y="150" width="400" height="145" rx="12" class="node"/><text x="1008" y="182" class="title">运行证据目录</text><text x="1008" y="214" class="detail">估计值、区间、基线与诊断</text><text x="1008" y="239" class="detail">具体 run / plan / dataset 指纹</text><text x="1008" y="264" class="detail">按结构化引用读取精确数值</text><rect x="50" y="390" width="870" height="150" rx="12" class="planned"/><text x="68" y="422" class="title">检索子图 · 有限补充，不自造依据</text><text x="68" y="454" class="detail">检索 → 检查来源与覆盖 → 按缺口补检索 → 回答或说明不足</text><text x="68" y="479" class="detail">来源位置、版本、访问范围和内容指纹随结果传递</text><text x="68" y="504" class="detail">达到预算或没有证据增量即停止；不以自评分证明真实性</text><rect x="990" y="390" width="400" height="150" rx="12" class="node"/><text x="1008" y="422" class="title">精确事实查询 · 非向量检索</text><text x="1008" y="454" class="detail">按运行目录核对归属和摘要</text><text x="1008" y="479" class="detail">数值占位符引用真实统计结果</text><text x="1008" y="504" class="detail">不能用相似文本替代运行数值</text><rect x="250" y="670" width="940" height="145" rx="12" class="planned"/><text x="268" y="702" class="title">上下文组装与本地校验</text><text x="268" y="734" class="detail">方法依据 + 已确认口径 + 精确数值 + 未决限制</text><text x="268" y="759" class="detail">先检查Schema、引用、数值和解释权限，再呈现研究结论</text><text x="268" y="784" class="detail">业务资料不能证明识别成立；论文不能证明本数据满足假设</text><rect x="250" y="900" width="940" height="100" rx="12" class="node"/><text x="268" y="932" class="title">输出：可读结论与可追踪依据</text><text x="268" y="964" class="detail">基线—幅度—实际含义—行动建议；缺少分母、成本或单位时明确说明</text><text x="50" y="1055" class="note">2026-10-31 · 实线框：现有核心；虚线框：建议新增或改造，尚未接入正式流程。</text></svg>
