<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="970" viewBox="0 0 1400 970" role="img" aria-labelledby="title desc"><title id="title">方法依据与运行证据 · 双通道设计</title><desc id="desc">方法与业务知识用于解释和选型；本次结果数值只从运行证据读取，不从相似文本生成。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#677783"/></marker></defs><rect width="1400" height="970" fill="#fff"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#23343e}.heading{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#52636e}.node{fill:#f3f8fa;stroke:#7795a3;stroke-width:1.5}.planned{fill:#fff8eb;stroke:#ae863f;stroke-width:1.5;stroke-dasharray:7 4}.title{font-size:20px;font-weight:600}.detail{font-size:16px;fill:#425763}.edge{fill:none;stroke:#677783;stroke-width:2;marker-end:url(#arrow)}.note{font-size:14px;fill:#536670}.group{fill:#fbfcfd;stroke:#d4dde2;stroke-width:1.2}</style><text x="50" y="52" class="heading">方法依据与运行证据 · 双通道设计</text><text x="50" y="85" class="subtitle">方法与业务知识用于解释和选型；本次结果数值只从运行证据读取，不从相似文本生成。</text><path class="edge" d="M245 240 V310"/><path class="edge" d="M695 240 V310"/><path class="edge" d="M1175 240 V310"/><path class="edge" d="M470 455 V510 H700 V550"/><text x="480" y="495" class="note">方法/口径出处</text><path class="edge" d="M1175 455 V610 H1000"/><text x="1186" y="510" class="note">事实 ID</text><path class="edge" d="M700 670 V755"/><rect x="50" y="130" width="390" height="110" rx="11" class="planned"/><text x="68" y="161" class="title">方法与实证资料</text><text x="68" y="191" class="detail">官方文档、可合法访问的论文页</text><text x="68" y="215" class="detail">登记出处、访问范围、许可与版本</text><rect x="500" y="130" width="390" height="110" rx="11" class="planned"/><text x="518" y="161" class="title">业务与数据口径资料</text><text x="518" y="191" class="detail">字段字典、指标定义、窗口与单位</text><text x="518" y="215" class="detail">由数据所有者登记并单独授权</text><rect x="50" y="310" width="840" height="145" rx="11" class="planned"/><text x="68" y="341" class="title">文档整理与检索接口 · LangChain 适配</text><text x="68" y="371" class="detail">按章节切分并保留公式、表格和出处；现有词法检索先作基线</text><text x="68" y="395" class="detail">根据固定评测再引入 Embedding / 混合检索 / 可选重排</text><text x="68" y="419" class="detail">命中文本保留来源、位置、版本指纹，不把摘要当原文</text><rect x="1000" y="130" width="350" height="110" rx="11" class="node"/><text x="1018" y="161" class="title">本次已完成运行</text><text x="1018" y="191" class="detail">ToolResult / run_id</text><text x="1018" y="215" class="detail">数值、区间、诊断与解释等级</text><rect x="1000" y="310" width="350" height="145" rx="11" class="node"/><text x="1018" y="341" class="title">结构化证据查询</text><text x="1018" y="371" class="detail">只读事实目录与归属校验</text><text x="1018" y="395" class="detail">不对数字事实做相似度替代</text><text x="1018" y="419" class="detail">不混入其他运行的结果</text><rect x="400" y="550" width="600" height="120" rx="11" class="planned"/><text x="418" y="581" class="title">上下文组装与受控模型生成</text><text x="418" y="611" class="detail">检索命中 + 本次研究设计 + 事实引用</text><text x="418" y="635" class="detail">未知问题返回依据不足；不虚构来源或数值</text><rect x="400" y="755" width="600" height="125" rx="11" class="node"/><text x="418" y="786" class="title">本地校验与最终解释</text><text x="418" y="816" class="detail">数值、引用、版本、主张等级检查</text><text x="418" y="840" class="detail">通过后展示结论、图表与依据；失败明确说明</text><text x="50" y="947" class="note">CausalOps · 代码核查日期 2026-10-31 · 实线框：现有能力；虚线框：建议新增或改造，尚未接入正式流程。</text></svg>