<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160" role="img" aria-labelledby="title desc"><title id="title">研究任务工作流 · 建议迁移顺序</title><desc id="desc">通过明确节点组织任务；缺少事实时暂停；所有新统计执行仍经版本绑定的人工审核。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#677783"/></marker></defs><rect width="1400" height="1160" fill="#fff"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#23343e}.heading{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#52636e}.node{fill:#f3f8fa;stroke:#7795a3;stroke-width:1.5}.planned{fill:#fff8eb;stroke:#ae863f;stroke-width:1.5;stroke-dasharray:7 4}.title{font-size:20px;font-weight:600}.detail{font-size:16px;fill:#425763}.edge{fill:none;stroke:#677783;stroke-width:2;marker-end:url(#arrow)}.note{font-size:14px;fill:#536670}.group{fill:#fbfcfd;stroke:#d4dde2;stroke-width:1.2}</style><text x="50" y="52" class="heading">研究任务工作流 · 建议迁移顺序</text><text x="50" y="85" class="subtitle">通过明确节点组织任务；缺少事实时暂停；所有新统计执行仍经版本绑定的人工审核。</text><path class="edge" d="M700 202 V242"/><path class="edge" d="M700 324 V364"/><path class="edge" d="M410 404 H335"/><text x="345" y="388" class="note">需补充</text><path class="edge" d="M192 360 V284 H410"/><text x="227" y="268" class="note">补充后</text><path class="edge" d="M700 446 V506"/><text x="716" y="484" class="note">可进入审核</text><path class="edge" d="M990 551 H1060"/><path class="edge" d="M1205 500 V405 H990"/><text x="1055" y="388" class="note">修改</text><path class="edge" d="M700 601 V665"/><text x="717" y="643" class="note">批准记录核验</text><path class="edge" d="M700 760 V820"/><path class="edge" d="M700 915 V975"/><path class="edge" d="M990 1015 H1030 V284 H990"/><text x="1040" y="960" class="note">新研究 / 修订</text><rect x="410" y="120" width="580" height="82" rx="11" class="planned"/><text x="428" y="151" class="title">输入任务并加载研究上下文</text><text x="428" y="181" class="detail">任务、数据版本、当前运行及预算</text><rect x="410" y="242" width="580" height="82" rx="11" class="planned"/><text x="428" y="273" class="title">识别意图并检索方法依据</text><text x="428" y="303" class="detail">数据体检 / 制定计划 / 结果问答 / 方法咨询</text><rect x="410" y="364" width="580" height="82" rx="11" class="planned"/><text x="428" y="395" class="title">生成候选并检查数据与设计条件</text><text x="428" y="425" class="detail">保留识别门控；不能从表中推定随机化</text><rect x="50" y="360" width="285" height="132" rx="11" class="planned"/><text x="68" y="391" class="title">缺少必要信息</text><text x="68" y="421" class="detail">集中列出最少必答项</text><text x="68" y="445" class="detail">用户补充后继续</text><text x="68" y="469" class="detail">不自动填成“已验证”</text><rect x="410" y="506" width="580" height="95" rx="11" class="planned"/><text x="428" y="537" class="title">审核节点 · interrupt</text><text x="428" y="567" class="detail">展示版本差异与所需事实；仅人工接受与批准</text><rect x="1060" y="500" width="290" height="134" rx="11" class="planned"/><text x="1078" y="531" class="title">取消或修改</text><text x="1078" y="561" class="detail">取消停止后续步骤</text><text x="1078" y="585" class="detail">修改形成新候选版本</text><text x="1078" y="609" class="detail">旧批准不自动继承</text><rect x="410" y="665" width="580" height="95" rx="11" class="node"/><text x="428" y="696" class="title">执行工具并保存结果</text><text x="428" y="726" class="detail">TaskRuntime 负责执行令牌、调和与去重</text><rect x="410" y="820" width="580" height="95" rx="11" class="node"/><text x="428" y="851" class="title">诊断与结论解释</text><text x="428" y="881" class="detail">不满足识别条件时降级主张，不追逐显著性</text><rect x="410" y="975" width="580" height="95" rx="11" class="planned"/><text x="428" y="1006" class="title">报告与后续问答</text><text x="428" y="1036" class="detail">同一运行继续讨论；新分析走新计划与审核</text><text x="50" y="1137" class="note">CausalOps · 代码核查日期 2026-10-31 · 实线框：现有能力；虚线框：建议新增或改造，尚未接入正式流程。</text></svg>