<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">研究工作流 · 同一入口，按任务分流</title><desc id="desc">方法咨询不重算；研究设计待审核；结果追问绑定指定运行。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#607783"/></marker></defs><style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#23343e}.heading{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#52636e}.node{fill:#f0f7fa;stroke:#658b9d;stroke-width:1.5}.planned{fill:#fff8eb;stroke:#ae863f;stroke-width:1.5;stroke-dasharray:7 4}.title{font-size:21px;font-weight:600}.detail{font-size:17px;fill:#425763}.edge{fill:none;stroke:#607783;stroke-width:2;marker-end:url(#arrow)}.note{font-size:16px;fill:#536670}</style><rect width="1440" height="1080" fill="white"/><text x="50" y="53" class="heading">研究工作流 · 同一入口，按任务分流</text><text x="50" y="88" class="subtitle">方法咨询不重算；研究设计待审核；结果追问绑定指定运行。</text><path class="edge" d="M460 200 H250 V330"/><path class="edge" d="M720 260 V330"/><path class="edge" d="M980 200 H1190 V330"/><path class="edge" d="M250 475 V580"/><path class="edge" d="M720 475 V580"/><path class="edge" d="M1190 475 V580"/><path class="edge" d="M720 700 V790"/><path class="edge" d="M920 862 H1190 V700"/><rect x="460" y="140" width="520" height="120" rx="12" class="planned"/><text x="478" y="172" class="title">1 · ResearchService + Supervisor</text><text x="478" y="204" class="detail">校验任务范围，输出结构化路线</text><text x="478" y="229" class="detail">不明确的问题进入澄清，不猜测批准</text><rect x="50" y="330" width="400" height="145" rx="12" class="planned"/><text x="68" y="362" class="title">2A · 方法或口径咨询</text><text x="68" y="394" class="detail">检索方法 / 业务资料</text><text x="68" y="419" class="detail">检查出处与限制</text><text x="68" y="444" class="detail">证据不足则补检索或说明缺口</text><rect x="520" y="330" width="400" height="145" rx="12" class="planned"/><text x="538" y="362" class="title">2B · 新分析或研究修订</text><text x="538" y="394" class="detail">检查数据，提出候选计划</text><text x="538" y="419" class="detail">比较差异与人工事实冲突</text><text x="538" y="444" class="detail">保存待审版本，不直接执行</text><rect x="990" y="330" width="400" height="145" rx="12" class="planned"/><text x="1008" y="362" class="title">2C · 已完成运行追问</text><text x="1008" y="394" class="detail">读取指定 run 的精确证据</text><text x="1008" y="419" class="detail">检索必要方法解释</text><text x="1008" y="444" class="detail">需要新估计时转为候选计划</text><rect x="50" y="580" width="400" height="120" rx="12" class="planned"/><text x="68" y="612" class="title">3A · 有依据的说明</text><text x="68" y="644" class="detail">输出来源位置及未覆盖内容</text><text x="68" y="669" class="detail">不会产生新的统计运行</text><rect x="520" y="580" width="400" height="120" rx="12" class="planned"/><text x="538" y="612" class="title">3B · 审核中断与批准校验</text><text x="538" y="644" class="detail">批准绑定计划和数据版本</text><text x="538" y="669" class="detail">失效批准必须重新审核</text><rect x="990" y="580" width="400" height="120" rx="12" class="planned"/><text x="1008" y="612" class="title">3C · 校验后的结果解释</text><text x="1008" y="644" class="detail">数值、引用、范围和解释上限</text><text x="1008" y="669" class="detail">不边生成边发布未校验结论</text><rect x="520" y="790" width="400" height="145" rx="12" class="node"/><text x="538" y="822" class="title">4 · 现有统计运行时</text><text x="538" y="854" class="detail">取得执行权、复用或计算</text><text x="538" y="879" class="detail">保存 ToolResult 和诊断</text><text x="538" y="904" class="detail">失败停止，不自动挑显著方法</text><text x="50" y="1015" class="note">所有路线产生可追踪应用事件；新数据外发单独授权；接受候选、批准与执行是不同操作。</text><text x="50" y="1055" class="note">2026-10-31 · 实线框：现有核心；虚线框：建议新增或改造，尚未接入正式流程。</text></svg>
