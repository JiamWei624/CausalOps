<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="800" height="373" viewBox="0 0 800 373"><title id="t">方法选择与待核对条件</title><desc id="d">图中列出候选方向；条件不足时保留缺项，返回研究设计。</desc>
