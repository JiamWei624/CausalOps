<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc"><title id="title">CausalOps 0.8.0 已实现架构</title><desc id="desc">LangGraph首个迁移闭环，保留原统计与证据内核；完整目标仍分阶段推进。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#607783"/></marker></defs><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#23343e}.node{fill:#f0f7fa;stroke:#658b9d;stroke-width:1.5}.planned{fill:#fff8eb;stroke:#ae863f;stroke-width:1.5;stroke-dasharray:7 4}.title{font-size:21px;font-weight:600}.detail{font-size:17px;fill:#425763}.edge{fill:none;stroke:#607783;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1440" height="1120" fill="white"/><text x="50" y="55" font-size="30" font-weight="700">CausalOps 0.8.0 · 首个迁移闭环已实现</text><text x="50" y="90" font-size="17">实线框为本轮可运行组件；图状态与领域事实分别保存，统计实现继续复用。</text><path class="edge" d="M720 250 V320"/><path class="edge" d="M460 390 H400"/><path class="edge" d="M980 390 H1040"/><path class="edge" d="M720 460 V540"/><path class="edge" d="M460 610 H400"/><path class="edge" d="M980 610 H1040"/><path class="edge" d="M720 680 V760"/><path class="edge" d="M720 900 V970"/><rect x="460" y="140" width="520" height="110" rx="12" class="node"/><text class="title" x="478" y="172">Streamlit → ResearchService</text><text class="detail" x="478" y="203">同一任务输入、计划、审核、结果和追问</text><text class="detail" x="478" y="228">可切回原工作台；不迁移旧图状态</text><rect x="460" y="320" width="520" height="140" rx="12" class="node"/><text class="title" x="478" y="352">LangGraph StateGraph</text><text class="detail" x="478" y="383">结构化路由 → 检索 → 候选 → 审核中断</text><text class="detail" x="478" y="408">批准后执行 → 运行证据问答</text><text class="detail" x="478" y="433">真实节点事件，SQLite持久检查点</text><rect x="50" y="320" width="350" height="140" rx="12" class="node"/><text class="title" x="68" y="352">模型网关 · 可选</text><text class="detail" x="68" y="383">保留多服务商适配与授权</text><text class="detail" x="68" y="408">模型只路由、提案和解释</text><text class="detail" x="68" y="433">没有模型时明确使用本地规则</text><rect x="1040" y="320" width="350" height="140" rx="12" class="node"/><text class="title" x="1058" y="352">LangChain Core 检索</text><text class="detail" x="1058" y="383">BaseRetriever / Document</text><text class="detail" x="1058" y="408">复用原方法卡、TF-IDF与来源</text><text class="detail" x="1058" y="433">不是全文向量库升级</text><rect x="460" y="540" width="520" height="140" rx="12" class="node"/><text class="title" x="478" y="572">领域批准 + 固定ToolGateway</text><text class="detail" x="478" y="603">批准绑定计划、数据、人工事实和代码</text><text class="detail" x="478" y="628">恢复信号不代替批准；同流程OS锁</text><text class="detail" x="478" y="653">三个固定入口：方法 / 已审计算 / 回答</text><rect x="50" y="540" width="350" height="140" rx="12" class="node"/><text class="title" x="68" y="572">图检查点 SQLite</text><text class="detail" x="68" y="603">仅保存引用、路线和阶段</text><text class="detail" x="68" y="628">不存密钥、原始表格或模型</text><text class="detail" x="68" y="653">重启后恢复暂停位置</text><rect x="1040" y="540" width="350" height="140" rx="12" class="node"/><text class="title" x="1058" y="572">领域数据库 SQLite</text><text class="detail" x="1058" y="603">计划、批准、流程与运行</text><text class="detail" x="1058" y="628">候选请求键防重复建版</text><text class="detail" x="1058" y="653">与图数据库不共享原子事务</text><rect x="460" y="760" width="520" height="140" rx="12" class="node"/><text class="title" x="478" y="792">原统计内核 · TaskRuntime / AnalysisTools</text><text class="detail" x="478" y="823">保留17项方法、执行权和结果调和</text><text class="detail" x="478" y="848">方法条件不足继续阻断</text><text class="detail" x="478" y="873">ToolResult保持数据与结果归属</text><rect x="460" y="970" width="520" height="100" rx="12" class="node"/><text class="title" x="478" y="1002">运行证据 → 结果解释与报告</text><text class="detail" x="478" y="1033">精确数值、来源、图表；追问不重新估计</text><text x="50" y="1100" font-size="15">后续：补充检索子图、长期记忆治理、外部MCP客户端、HTTP/SSE与独立用户评测。</text></svg>
