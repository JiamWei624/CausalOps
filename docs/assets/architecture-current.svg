<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="895" viewBox="0 0 1280 895" role="img" aria-labelledby="title desc"><title id="title">CausalOps 0.14 · 已实现架构</title><desc id="desc">本地单用户；模型提出建议，统计内核负责计算，证据层约束解释。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 Z" fill="#607387"/></marker></defs><style>text{font-family:Microsoft YaHei,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#172c3d}.sub{font-size:17px;fill:#526477}.head{font-size:21px;font-weight:700;fill:#164e4b}.line{font-size:17px;fill:#34485a}</style><rect width="1280" height="895" fill="#f4f7fa"/><text class="title" x="40" y="52">CausalOps 0.14 · 已实现架构</text><text class="sub" x="40" y="84">本地单用户；模型提出建议，统计内核负责计算，证据层约束解释。</text><rect x="40" y="112" width="1200" height="118" rx="12" fill="white" stroke="#cbd8df"/><rect x="40" y="112" width="7" height="118" fill="#24776d"/><text class="head" x="65" y="144">交互层 / Streamlit</text><text class="line" x="65" y="178">正式工作台入口 → 自动概览与建议 → 连续对话 → 待审方案 → 结论。</text><text class="line" x="65" y="208">连接状态仅存内存；完整数据字典与手动路线放在高级设置。</text><path d="M640 232 L640 253" stroke="#607387" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="257" width="1200" height="118" rx="12" fill="white" stroke="#cbd8df"/><rect x="40" y="257" width="7" height="118" fill="#24776d"/><text class="head" x="65" y="289">应用层 / ResearchService</text><text class="line" x="65" y="323">数据版本、问题、口径、候选、批准、运行与会话统一管理。</text><text class="line" x="65" y="353">一键基础报告为显式且限权的快捷操作，不暴露为模型工具。</text><path d="M640 377 L640 398" stroke="#607387" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="402" width="1200" height="118" rx="12" fill="white" stroke="#cbd8df"/><rect x="40" y="402" width="7" height="118" fill="#24776d"/><text class="head" x="65" y="434">编排层 / LangGraph 主图与方法研究子图</text><text class="line" x="65" y="468">加载 → 路由 → 问题发现 / 方法检索 → 计划 → 审核中断 → 执行。</text><text class="line" x="65" y="498">SQLite 检查点；一个本地工作线程，最多四项排队，支持安全停止与恢复。</text><path d="M640 522 L640 543" stroke="#607387" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="547" width="1200" height="118" rx="12" fill="white" stroke="#cbd8df"/><rect x="40" y="547" width="7" height="118" fill="#24776d"/><text class="head" x="65" y="579">知识与工具 / LangChain 适配 + 本地统计</text><text class="line" x="65" y="613">20 张知识卡、27 条来源；字符 TF-IDF 检索与来源校验。</text><text class="line" x="65" y="643">三类执行器、17 项方法；官方包估计、诊断、结果主张降级。</text><path d="M640 667 L640 688" stroke="#607387" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="692" width="1200" height="118" rx="12" fill="white" stroke="#cbd8df"/><rect x="40" y="692" width="7" height="118" fill="#24776d"/><text class="head" x="65" y="724">证据与接口 / SQLite、报告、只读 MCP、A2A</text><text class="line" x="65" y="758">数字事实绑定运行；引用校验、四部分结论与持久化问答。</text><text class="line" x="65" y="788">MCP 只读方法/证据；A2A 为本机规则审阅，不是多模型自主科研。</text></svg>