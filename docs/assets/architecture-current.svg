<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 470" width="900"><title id="title">CausalOps 运行架构</title><desc id="desc">交互经研究服务进入编排，读取方法资料与可选模型建议；人工批准绑定到计划版本后，本地统计工具产生运行证据，问答读取指定运行。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#334b58" stroke-width="1.5"/></marker></defs><style>text{font-family:'Segoe UI','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#182e39}.big{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:650}.note{font-size:16px}.meta{font-size:14px;fill:#3e5965}</style><rect width="900" height="470" fill="white"/><text x="22" y="38" class="big">谁提出方案，谁批准，谁给出数字？</text><rect x="24" y="72" width="240" height="74" rx="7" fill="#f2f5f7" stroke="#aebec5"/><text x="38" y="101" class="label">使用者 · Streamlit</text><text x="38" y="127" class="note">上传表、提问、查看报告</text><path d="M266 108 H321" stroke="#334b58" stroke-width="2"  fill="none" marker-end="url(#arr)"/><rect x="327" y="72" width="245" height="74" rx="7" fill="#f2f5f7" stroke="#aebec5"/><text x="341" y="101" class="label">研究服务 · LangGraph</text><text x="341" y="127" class="note">冻结口径、路由、待审计划</text><path d="M575 95 H635" stroke="#334b58" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/><path d="M635 125 H577" stroke="#334b58" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/><rect x="641" y="72" width="235" height="74" rx="7" fill="#f2f5f7" stroke="#aebec5"/><text x="654" y="101" class="label">设计依据与模型建议</text><text x="654" y="127" class="note">方法检索；模型按授权调用</text><path d="M448 148 V201" stroke="#334b58" stroke-width="2"  fill="none" marker-end="url(#arr)"/><rect x="327" y="207" width="245" height="66" rx="7" fill="#fff3df" stroke="#ab7934"/><text x="341" y="236" class="label">人工审核</text><text x="341" y="258" class="note">批准绑定数据、口径与计划</text><path d="M448 276 V329" stroke="#334b58" stroke-width="2"  fill="none" marker-end="url(#arr)"/><rect x="327" y="335" width="245" height="76" rx="7" fill="#f2f5f7" stroke="#aebec5"/><text x="341" y="365" class="label">本地统计执行器</text><text x="341" y="391" class="note">估计、区间、诊断与单位</text><path d="M575 372 H635" stroke="#334b58" stroke-width="2"  fill="none" marker-end="url(#arr)"/><rect x="641" y="335" width="235" height="76" rx="7" fill="#eaf5f1" stroke="#438274"/><text x="655" y="365" class="label">带编号的运行证据</text><text x="655" y="391" class="note">指标、数值、来源与限制</text><path d="M758 332 V244 H626 V184 H145 V150" stroke="#334b58" stroke-width="2"  fill="none" marker-end="url(#arr)"/><text x="31" y="181" class="meta">按所选运行回答</text><text x="25" y="446" class="meta">实线：操作与证据流转　　虚线：设计时检索或咨询　　SQLite 保存版本与运行关联，原表留在本地。</text></svg>