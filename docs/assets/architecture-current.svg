<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1120" viewBox="0 0 1420 1120"><title>CausalOps 0.9.0 实际架构</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#667a82"/></marker></defs><rect width="1420" height="1120" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#1c3340"><text x="40" y="48" font-size="30" font-weight="700">CausalOps 0.9.0 · 已实现组件与权限边界</text><text x="40" y="82" font-size="17">方法依据、人工事实与统计证据分开保存；本机单用户，非任意数据自动因果研究。</text><rect x="400" y="110" width="640" height="90" rx="12" fill="#f1f6f7" stroke="#52777f"/><text x="418" y="141" font-size="21" font-weight="600">Streamlit · 数据与研究工作台</text><text x="418" y="172" font-size="17" font-weight="400">导入 / 字典 / 计划 / 审核 / 运行问答</text><rect x="400" y="250" width="640" height="90" rx="12" fill="#f1f6f7" stroke="#52777f"/><text x="418" y="281" font-size="21" font-weight="600">ResearchService · 唯一业务服务入口</text><text x="418" y="312" font-size="17" font-weight="400">数据、字典、计划、知识库与代码版本绑定</text><rect x="40" y="390" width="400" height="150" rx="12" fill="#f1f6f7" stroke="#52777f"/><text x="58" y="421" font-size="21" font-weight="600">DataContract · 人工数据字典</text><text x="58" y="452" font-size="17" font-weight="400">字段角色 / 测量时点 / 指标单位</text><text x="58" y="483" font-size="17" font-weight="400">不可变版本 · 声明不等于验证</text><rect x="510" y="390" width="400" height="150" rx="12" fill="#f1f6f7" stroke="#52777f"/><text x="528" y="421" font-size="21" font-weight="600">LangGraph 方法研究子图</text><text x="528" y="452" font-size="17" font-weight="400">确定方法 → 检索 → 条件核对</text><text x="528" y="483" font-size="17" font-weight="400">补检最多三轮 · 无依据即停止</text><rect x="980" y="390" width="400" height="150" rx="12" fill="#f1f6f7" stroke="#52777f"/><text x="998" y="421" font-size="21" font-weight="600">BackgroundJobs · 本地后台</text><text x="998" y="452" font-size="17" font-weight="400">单工作线程 · 最多四项排队</text><text x="998" y="483" font-size="17" font-weight="400">真实进度 / 协作停止 / 安全恢复</text><rect x="400" y="610" width="640" height="95" rx="12" fill="#f1f6f7" stroke="#52777f"/><text x="418" y="641" font-size="21" font-weight="600">待审计划与审核中断</text><text x="418" y="672" font-size="17" font-weight="400">只有使用者批准；模型不能写入人工事实</text><rect x="400" y="770" width="640" height="95" rx="12" fill="#f1f6f7" stroke="#52777f"/><text x="418" y="801" font-size="21" font-weight="600">原统计与证据内核</text><text x="418" y="832" font-size="17" font-weight="400">TaskRuntime → 三类执行器 / 17项方法 → ToolResult</text><rect x="400" y="930" width="640" height="95" rx="12" fill="#f1f6f7" stroke="#52777f"/><text x="418" y="961" font-size="21" font-weight="600">报告与运行级证据问答</text><text x="418" y="992" font-size="17" font-weight="400">基线—幅度—实际含义—行动建议；引用可追溯</text><path d="M720 200V250" stroke="#667a82" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M720 340V390" stroke="#667a82" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M400 300H240V390" stroke="#667a82" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M1040 300H1180V390" stroke="#667a82" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M710 540V610" stroke="#667a82" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M240 540V655H400" stroke="#667a82" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M1180 540V655H1040" stroke="#667a82" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M720 705V770" stroke="#667a82" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M720 865V930" stroke="#667a82" fill="none" stroke-width="2" marker-end="url(#a)"/><text x="40" y="1080" font-size="17">模型认证仅在内存；后台任务与图检查点不保存原始数据行或密钥。独立用户效率尚未测量。</text></g></svg>