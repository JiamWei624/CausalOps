<svg xmlns="http://www.w3.org/2000/svg" width="820" height="558" viewBox="0 0 820 558" role="img" aria-labelledby="title desc">
<title id="title">CausalOps 0.16.0 组件与调用关系</title><desc id="desc">本机界面通过研究服务调用编排或委派已批准的计算。编排模块检索方法资料，可按许可咨询外部模型。统计执行器保存运行证据，结果追问读取指定运行。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#385061" stroke-width="1.3"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#203541}.title{font-size:22px;font-weight:700}.node{font-size:18px;font-weight:650}.desc{font-size:15px}.tag{font-size:14px;fill:#4c606b}.conn{fill:none;stroke:#385061;stroke-width:1.6;marker-end:url(#arrow)}</style>
<rect width="820" height="558" fill="#fff"/>
<text x="20" y="33" class="title">CausalOps 0.16.0　组件与调用关系</text>
<rect x="16" y="52" width="786" height="476" fill="none" stroke="#a7b4b9"/>
<text x="30" y="80" class="tag">本地工作台</text>
