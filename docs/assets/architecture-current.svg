<g><rect x="43" y="223" width="230" height="62" rx="4" fill="#f4f8f9" stroke="#889ca6" /><text x="55" y="248" class="node">研究服务</text><text x="55" y="271" class="desc">ResearchService · 版本与批准</text></g>
<g><rect x="463" y="223" width="230" height="62" rx="4" fill="#f4f8f9" stroke="#889ca6" /><text x="475" y="248" class="node">研究编排</text><text x="475" y="271" class="desc">LangGraph · 路由、计划与中断</text></g>
<g><rect x="463" y="345" width="230" height="62" rx="4" fill="#f4f8f9" stroke="#889ca6" /><text x="475" y="370" class="node">方法检索</text><text x="475" y="393" class="desc">LangChain · 方法卡与来源</text></g>
<g><rect x="43" y="345" width="230" height="62" rx="4" fill="#f4f8f9" stroke="#889ca6" /><text x="55" y="370" class="node">任务运行时与统计内核</text><text x="55" y="393" class="desc">TaskRuntime · 调用注册执行器</text></g>
<g><rect x="43" y="450" width="230" height="62" rx="4" fill="#f4f8f9" stroke="#889ca6" /><text x="55" y="475" class="node">运行记录</text><text x="55" y="498" class="desc">SQLite · 运行标识与证据关联</text></g>
<path d="M431 51 H803 V196 H431 Z" fill="#fff"/>
<path d="M431 52 V196 H802" fill="none" stroke="#a7b4b9"/>
<text x="463" y="80" class="tag">外部服务 · 可选</text>
<g><rect x="463" y="98" width="230" height="62" rx="4" fill="#fff" stroke="#707982" stroke-dasharray="5 3"/><text x="475" y="123" class="node">模型服务 API</text><text x="475" y="146" class="desc">生成候选方案或解释文本</text></g>
<path class="conn" d="M158 160 V218"/><text x="170" y="194" class="tag">提交请求或人工批准</text>
<path class="conn" d="M273 254 H458"/><text x="310" y="244" class="tag">组织分析计划</text>
<path class="conn" d="M578 223 V165"/><text x="590" y="215" class="tag">经许可调用</text>
<path class="conn" d="M578 285 V340"/><text x="589" y="322" class="tag">检索方法依据</text>
<path class="conn" d="M158 285 V340"/><text x="169" y="322" class="tag">派发已批准任务</text>
<path class="conn" d="M158 407 V445"/><text x="169" y="434" class="tag">保存运行结果</text>
<path class="conn" d="M273 272 H409 V481 H278"/>
<text x="415" y="465" class="tag">解释结果时读取指定运行</text>
<text x="20" y="550" class="tag">箭头由调用方指向被调用组件；模型外发许可和统计执行批准分别核验。</text>
