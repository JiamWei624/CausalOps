<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc"><title id="title">CausalOps · 目标架构与职责</title><desc id="desc">统一服务入口、结构化主管路由、受控工具、确定性统计与可追溯解释。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#607783"/></marker></defs><style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#23343e}.heading{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#52636e}.node{fill:#f0f7fa;stroke:#658b9d;stroke-width:1.5}.planned{fill:#fff8eb;stroke:#ae863f;stroke-width:1.5;stroke-dasharray:7 4}.title{font-size:21px;font-weight:600}.detail{font-size:17px;fill:#425763}.edge{fill:none;stroke:#607783;stroke-width:2;marker-end:url(#arrow)}.note{font-size:16px;fill:#536670}</style><rect width="1440" height="1120" fill="white"/><text x="50" y="53" class="heading">CausalOps · 目标架构与职责</text><text x="50" y="88" class="subtitle">统一服务入口、结构化主管路由、受控工具、确定性统计与可追溯解释。</text><path class="edge" d="M450 207 H520"/><path class="edge" d="M990 207 H920"/><path class="edge" d="M720 275 V340"/><path class="edge" d="M520 420 H450"/><path class="edge" d="M920 420 H990"/><path class="edge" d="M720 500 V570"/><path class="edge" d="M520 645 H450"/><path class="edge" d="M920 645 H990"/><path class="edge" d="M720 720 V790"/><path class="edge" d="M520 862 H450"/><path class="edge" d="M920 862 H990"/><rect x="50" y="140" width="400" height="135" rx="12" class="planned"/><text x="68" y="172" class="title">交互 · 当前保留 Streamlit</text><text x="68" y="204" class="detail">对话、当前计划、证据与图表</text><text x="68" y="229" class="detail">展示实际步骤与下一步</text><rect x="520" y="140" width="400" height="135" rx="12" class="planned"/><text x="538" y="172" class="title">ResearchService · 统一服务</text><text x="538" y="204" class="detail">候选、事实、批准、执行、问答</text><text x="538" y="229" class="detail">负责调用边界，不绑定界面框架</text><rect x="990" y="140" width="400" height="135" rx="12" class="planned"/><text x="1008" y="172" class="title">未来可选 · HTTP / SSE</text><text x="1008" y="204" class="detail">复用同一研究服务</text><text x="1008" y="229" class="detail">不是本轮前后端重写任务</text><rect x="50" y="340" width="400" height="160" rx="12" class="planned"/><text x="68" y="372" class="title">模型适配 · 保留现有网关</text><text x="68" y="404" class="detail">多服务商、结构化输出、本地校验</text><text x="68" y="429" class="detail">接收配置授权与调用预算</text><text x="68" y="454" class="detail">密钥不进入图状态</text><rect x="520" y="340" width="400" height="160" rx="12" class="planned"/><text x="538" y="372" class="title">LangGraph · Supervisor</text><text x="538" y="404" class="detail">枚举路由与有限状态</text><text x="538" y="429" class="detail">计划 / 方法 / 结果等有界子图</text><text x="538" y="454" class="detail">审核中断、恢复与真实事件</text><rect x="990" y="340" width="400" height="160" rx="12" class="planned"/><text x="1008" y="372" class="title">LangChain · 检索适配</text><text x="1008" y="404" class="detail">方法资料与业务口径分开检索</text><text x="1008" y="429" class="detail">来源位置与覆盖检查</text><text x="1008" y="454" class="detail">缺口补检索有预算和停止条件</text><rect x="50" y="570" width="400" height="150" rx="12" class="planned"/><text x="68" y="602" class="title">MCP / A2A · 协议边界</text><text x="68" y="634" class="detail">现有：只读查询与规则审阅</text><text x="68" y="659" class="detail">拟增：白名单 MCP 客户端</text><text x="68" y="684" class="detail">发现工具不等于获得权限</text><rect x="520" y="570" width="400" height="150" rx="12" class="planned"/><text x="538" y="602" class="title">ToolGateway · 工具入口</text><text x="538" y="634" class="detail">Schema、效果类型、范围与授权</text><text x="538" y="659" class="detail">只读 / 已审计算 / 导出 / 外部读</text><text x="538" y="684" class="detail">批准不能作为模型工具</text><rect x="990" y="570" width="400" height="150" rx="12" class="planned"/><text x="1008" y="602" class="title">检查点与上下文 · 分责</text><text x="1008" y="634" class="detail">图状态：引用、位置、预算</text><text x="1008" y="659" class="detail">聊天摘要：不可信辅助信息</text><text x="1008" y="684" class="detail">确认口径：版本化人工事实</text><rect x="50" y="790" width="400" height="145" rx="12" class="node"/><text x="68" y="822" class="title">领域存储 · 保留</text><text x="68" y="854" class="detail">SQLite、Parquet、研究版本</text><text x="68" y="879" class="detail">批准、运行、数据与结果指纹</text><text x="68" y="904" class="detail">不由图检查点取代</text><rect x="520" y="790" width="400" height="145" rx="12" class="node"/><text x="538" y="822" class="title">统计内核 · 保留</text><text x="538" y="854" class="detail">TaskRuntime / AnalysisTools</text><text x="538" y="879" class="detail">17 项方法、执行权与结果调和</text><text x="538" y="904" class="detail">批准与输入摘要核验</text><rect x="990" y="790" width="400" height="145" rx="12" class="node"/><text x="1008" y="822" class="title">证据与结论 · 保留</text><text x="1008" y="854" class="detail">ToolResult、运行证据与引用</text><text x="1008" y="879" class="detail">基线—幅度—含义—行动</text><text x="1008" y="904" class="detail">报告与同范围持续问答</text><text x="50" y="1010" class="note">调用原则：模型选择下一步；领域服务核验权限与事实；统计工具产生数值；解释必须回到具体运行证据。</text><text x="50" y="1045" class="note">LangGraph / LangChain 为迁移目标。当前 0.7.0 仍为自建编排，不以图示替代代码和验收。</text><text x="50" y="1095" class="note">2026-10-31 · 实线框：现有核心；虚线框：建议新增或改造，尚未接入正式流程。</text></svg>
