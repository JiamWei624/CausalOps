<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" role="img" aria-labelledby="title desc"><title id="title">CausalOps · 建议目标架构</title><desc id="desc">LangGraph 统一状态迁移；LangChain 适配检索与工具；保留本地统计、研究事实与证据合同。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#677783"/></marker></defs><rect width="1400" height="1010" fill="#fff"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#23343e}.heading{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#52636e}.node{fill:#f3f8fa;stroke:#7795a3;stroke-width:1.5}.planned{fill:#fff8eb;stroke:#ae863f;stroke-width:1.5;stroke-dasharray:7 4}.title{font-size:20px;font-weight:600}.detail{font-size:16px;fill:#425763}.edge{fill:none;stroke:#677783;stroke-width:2;marker-end:url(#arrow)}.note{font-size:14px;fill:#536670}.group{fill:#fbfcfd;stroke:#d4dde2;stroke-width:1.2}</style><text x="50" y="52" class="heading">CausalOps · 建议目标架构</text><text x="50" y="85" class="subtitle">LangGraph 统一状态迁移；LangChain 适配检索与工具；保留本地统计、研究事实与证据合同。</text><path class="edge" d="M700 230 V285"/><path class="edge" d="M400 355 H340"/><path class="edge" d="M1000 355 H1060"/><path class="edge" d="M700 430 V495"/><text x="716" y="468" class="note">批准 ID + 版本摘要</text><path class="edge" d="M700 600 V655"/><text x="717" y="635" class="note">统一运行证据</text><path class="edge" d="M400 705 H340"/><path class="edge" d="M1000 705 H1060"/><path class="edge" d="M1000 400 H1030 V870 H1000"/><text x="1040" y="868" class="note">检查点</text><path class="edge" d="M400 705 H370 V330 H400"/><text x="270" y="640" class="note">继续讨论</text><rect x="400" y="125" width="600" height="105" rx="11" class="planned"/><text x="418" y="156" class="title">交互层 · 同一研究任务</text><text x="418" y="186" class="detail">对话主区 + 当前计划 + 证据侧栏</text><text x="418" y="210" class="detail">步骤状态、补充信息、取消与恢复</text><rect x="400" y="285" width="600" height="145" rx="11" class="planned"/><text x="418" y="316" class="title">编排层 · LangGraph StateGraph</text><text x="418" y="346" class="detail">路由 → 检索 → 待审计划 → 审核中断</text><text x="418" y="370" class="detail">执行 → 诊断 → 报告 → 证据问答 / 受限修订</text><text x="418" y="394" class="detail">持久检查点只保存引用、状态和预算</text><rect x="50" y="285" width="290" height="145" rx="11" class="planned"/><text x="68" y="316" class="title">模型服务层</text><text x="68" y="346" class="detail">保留多服务商网关与授权</text><text x="68" y="370" class="detail">按需适配 LangChain 模型接口</text><text x="68" y="394" class="detail">密钥不进入图状态或检查点</text><rect x="1060" y="285" width="290" height="145" rx="11" class="planned"/><text x="1078" y="316" class="title">知识与检索层</text><text x="1078" y="346" class="detail">LangChain 检索器接口</text><text x="1078" y="370" class="detail">方法文献库 + 业务口径库</text><text x="1078" y="394" class="detail">数字证据采用结构化查询</text><rect x="400" y="495" width="600" height="105" rx="11" class="node"/><text x="418" y="526" class="title">领域工具层 · 保留并适配</text><text x="418" y="556" class="detail">AnalysisTools / TaskRuntime / 17 项统计方法</text><text x="418" y="580" class="detail">先核验批准版本与输入摘要，再复用或执行</text><rect x="400" y="655" width="600" height="105" rx="11" class="node"/><text x="418" y="686" class="title">证据与结论层 · 保留并完善</text><text x="418" y="716" class="detail">数值引用、区间、识别限制、来源定位</text><text x="418" y="740" class="detail">基线—幅度—实际含义—行动建议</text><rect x="50" y="670" width="290" height="150" rx="11" class="node"/><text x="68" y="701" class="title">领域数据与审计</text><text x="68" y="731" class="detail">研究 SQLite / Parquet</text><text x="68" y="755" class="detail">版本、批准、运行与证据</text><text x="68" y="779" class="detail">统计执行的领域事实源</text><rect x="1060" y="670" width="290" height="150" rx="11" class="node"/><text x="1078" y="701" class="title">协议接入层</text><text x="1078" y="731" class="detail">MCP：工具与来源查询</text><text x="1078" y="755" class="detail">A2A：有边界的审阅任务</text><text x="1078" y="779" class="detail">不绕过批准与数据发送权限</text><rect x="400" y="825" width="600" height="95" rx="11" class="planned"/><text x="418" y="856" class="title">图状态持久化 · 单独图存储</text><text x="418" y="886" class="detail">LangGraph Checkpointer；与领域数据库分责</text><text x="50" y="987" class="note">CausalOps · 代码核查日期 2026-10-31 · 实线框：现有能力；虚线框：建议新增或改造，尚未接入正式流程。</text></svg>