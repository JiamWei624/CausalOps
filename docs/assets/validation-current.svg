<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="350" viewBox="0 0 1320 350" role="img" aria-labelledby="t d"><title id="t">真实任务验收：首次与修复后分开报告</title><desc id="d">首次留出任务七项通过、共八项。最终运行问答七项通过、共七项，其中一项有限修复。不能合并成开放任务准确率。</desc><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#172c44}.h{font-size:25px;font-weight:700}.s{font-size:18px}.n{font-size:50px;font-weight:700}</style><rect width="1320" height="350" fill="#f5f8fb"/><text x="35" y="45" class="h">真实模型验收 · 0.10.0</text><rect x="35" y="75" width="610" height="180" rx="12" fill="white" stroke="#bccbda"/><rect x="675" y="75" width="610" height="180" rx="12" fill="white" stroke="#bccbda"/><text x="65" y="112" class="s">首次留出任务：不同业务问题，不预写方法名</text><text x="65" y="180" class="n">7 / 8</text><text x="65" y="220" class="s">失败记录保留；后续修复不改写首次结果</text><text x="705" y="112" class="s">最终运行证据问答：不重新计算统计</text><text x="705" y="180" class="n">7 / 7</text><text x="705" y="220" class="s">六项直接通过，一项经过一次受限修复</text><text x="35" y="295" class="s">两组验收口径不同，不能合并为“全流程准确率”；独立用户验收仍未开展。</text><text x="35" y="326" class="s">固定公开/合成数据；明细见 docs/current/VALIDATION.md 与版本化JSON记录。</text></svg>