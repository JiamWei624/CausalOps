<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="800" height="373" viewBox="0 0 800 373"><title id="t">研究质量检查</title><desc id="d">结构检查通过仅表示相应检查未阻断；研究假设仍需有独立依据。</desc>
