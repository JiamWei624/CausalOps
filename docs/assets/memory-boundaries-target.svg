<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc"><title id="title">记忆与事实 · 允许记住，不等于可以采信</title><desc id="desc">拟议职责划分；现有领域SQLite、数据版本、运行证据和来源快照继续保留。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#607783"/></marker></defs><style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#23343e}.heading{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#52636e}.node{fill:#f0f7fa;stroke:#658b9d;stroke-width:1.5}.planned{fill:#fff8eb;stroke:#ae863f;stroke-width:1.5;stroke-dasharray:7 4}.title{font-size:21px;font-weight:600}.detail{font-size:17px;fill:#425763}.edge{fill:none;stroke:#607783;stroke-width:2;marker-end:url(#arrow)}.note{font-size:16px;fill:#536670}</style><rect width="1440" height="1050" fill="white"/><text x="50" y="53" class="heading">记忆与事实 · 允许记住，不等于可以采信</text><text x="50" y="88" class="subtitle">拟议职责划分；现有领域SQLite、数据版本、运行证据和来源快照继续保留。</text><path class="edge" d="M360 320 V440"/><path class="edge" d="M1080 320 V440"/><path class="edge" d="M360 600 V680 H550 V760"/><path class="edge" d="M1080 600 V680 H890 V760"/><rect x="50" y="160" width="620" height="160" rx="12" class="planned"/><text x="68" y="192" class="title">图检查点 · 执行状态</text><text x="68" y="224" class="detail">保存节点位置、有限引用、预算和待处理事项</text><text x="68" y="249" class="detail">用于暂停与恢复，不保存密钥或原始表格</text><text x="68" y="274" class="detail">恢复后仍向领域库核对批准与运行状态</text><rect x="770" y="160" width="620" height="160" rx="12" class="planned"/><text x="788" y="192" class="title">对话与摘要 · 辅助上下文</text><text x="788" y="224" class="detail">记录解释历史、未决问题与偏好</text><text x="788" y="249" class="detail">模型抽取内容标为待确认，不自动成为事实</text><text x="788" y="274" class="detail">按任务 / 数据 / 计划 / 运行限定上下文</text><rect x="50" y="440" width="620" height="160" rx="12" class="node"/><text x="68" y="472" class="title">领域数据库 · 研究记录</text><text x="68" y="504" class="detail">版本、批准、执行尝试、运行和精确证据</text><text x="68" y="529" class="detail">是统计副作用与解释归属的权威来源</text><text x="68" y="554" class="detail">保持现有 TaskRuntime 的结果调和与执行权</text><rect x="770" y="440" width="620" height="160" rx="12" class="planned"/><text x="788" y="472" class="title">DataContract · 经人工确认的口径</text><text x="788" y="504" class="detail">字段含义、单位、粒度和测量时点</text><text x="788" y="529" class="detail">声明与程序检查有不同证据类型</text><text x="788" y="554" class="detail">人工声明仍不等于因果假设经验证明</text><rect x="270" y="760" width="900" height="150" rx="12" class="planned"/><text x="288" y="792" class="title">统一研究上下文 · 组装后校验</text><text x="288" y="824" class="detail">引用领域版本和已确认口径，附上未解决项</text><text x="288" y="849" class="detail">知识索引提供来源，精确数值取自运行，不取自聊天记忆</text><text x="288" y="874" class="detail">新数据、计划或运行变更后重新限定范围；权限不从摘要继承</text><text x="50" y="990" class="note">未来多用户部署须另建身份、权限和隔离；thread_id 或命名空间本身不代表完整鉴权。</text><text x="50" y="1025" class="note">2026-10-31 · 实线框：现有核心；虚线框：建议新增或改造，尚未接入正式流程。</text></svg>
