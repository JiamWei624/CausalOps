<rect x="670.0" y="585" width="610.0" height="120" rx="10" fill="white" stroke="#c3cfdb"/>
<text x="690.0" y="617" class="h">统一报告与可追溯讨论</text>
<text x="690.0" y="647" class="p">每条结论回到具体运行与证据</text>
