<text x="60.0" y="492" class="p">区分可用字段与人工事实</text>
<text x="60.0" y="515" class="p">不借用文献结论替代本次分析</text>
<rect x="670.0" y="430" width="610.0" height="120" rx="10" fill="white" stroke="#c3cfdb"/>
<text x="690.0" y="462" class="h">结果解释</text>
<text x="690.0" y="492" class="p">数值依据和声明上限一起提供</text>
<text x="690.0" y="515" class="p">引用校验、语义检查、显式兜底</text>
<path d="M660 555 v20 m-7 -7 7 7 7-7" fill="none" stroke="#7b91a8" stroke-width="2"/>
<rect x="40.0" y="585" width="610.0" height="120" rx="10" fill="white" stroke="#c3cfdb"/>
