<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="605" viewBox="0 0 1280 605" role="img" aria-labelledby="title desc"><title id="title">方法依据与运行证据：两个不同通道</title><desc id="desc">文献告诉我们如何研究；运行记录告诉我们这次实际算出了什么。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 Z" fill="#607387"/></marker></defs><style>text{font-family:Microsoft YaHei,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#172c3d}.sub{font-size:17px;fill:#526477}.head{font-size:21px;font-weight:700;fill:#164e4b}.line{font-size:17px;fill:#34485a}</style><rect width="1280" height="605" fill="#f4f7fa"/><text class="title" x="40" y="52">方法依据与运行证据：两个不同通道</text><text class="sub" x="40" y="84">文献告诉我们如何研究；运行记录告诉我们这次实际算出了什么。</text><rect x="40" y="112" width="1200" height="118" rx="12" fill="white" stroke="#cbd8df"/><rect x="40" y="112" width="7" height="118" fill="#24776d"/><text class="head" x="65" y="144">方法通道 / 计划前</text><text class="line" x="65" y="178">官方方法文档 + 已核对范围的实证论文 → 原创知识卡 → 检索。</text><text class="line" x="65" y="208">每条保留原始 URL、位置、版本与核对范围；检索不到不编造来源。</text><path d="M640 232 L640 253" stroke="#607387" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="257" width="1200" height="118" rx="12" fill="white" stroke="#cbd8df"/><rect x="40" y="257" width="7" height="118" fill="#24776d"/><text class="head" x="65" y="289">计算通道 / 审核后</text><text class="line" x="65" y="323">人工口径 + 已批准计划 + 当前数据 → 本地注册工具 → 数值与诊断。</text><text class="line" x="65" y="353">运行事实和引用标识冻结；数据行不由模型估计或写入检索库。</text><path d="M640 377 L640 398" stroke="#607387" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="402" width="1200" height="118" rx="12" fill="white" stroke="#cbd8df"/><rect x="40" y="402" width="7" height="118" fill="#24776d"/><text class="head" x="65" y="434">解释通道 / 结果后</text><text class="line" x="65" y="468">运行数字事实 + 原口径 + 方法限制 → 模型解释 → 引用与语义检查。</text><text class="line" x="65" y="498">证据不足则明确限制；模型失败标注本地摘要，不伪装成功。</text></svg>