<text x="60.0" y="307" class="h">方法检索 RAG</text>
<text x="60.0" y="337" class="p">BaseRetriever + 字符 TF-IDF</text>
<text x="60.0" y="360" class="p">方法过滤、有限补检、缺口说明</text>
<rect x="670.0" y="275" width="610.0" height="120" rx="10" fill="white" stroke="#c3cfdb"/>
<text x="690.0" y="307" class="h">运行事实目录</text>
<text x="690.0" y="337" class="p">结果、系数、区间与样本量</text>
<text x="690.0" y="360" class="p">依据问题选取，限制证据预算</text>
<path d="M660 400 v20 m-7 -7 7 7 7-7" fill="none" stroke="#7b91a8" stroke-width="2"/>
<rect x="40.0" y="430" width="610.0" height="120" rx="10" fill="white" stroke="#c3cfdb"/>
