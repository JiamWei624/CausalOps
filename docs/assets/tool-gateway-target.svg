<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc"><title id="title">工具调用 · 从发现到执行的权限边界</title><desc id="desc">拟新增统一 ToolGateway；LangChain 与 MCP 只是适配方式，不另设批准逻辑。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#607783"/></marker></defs><style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#23343e}.heading{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#52636e}.node{fill:#f0f7fa;stroke:#658b9d;stroke-width:1.5}.planned{fill:#fff8eb;stroke:#ae863f;stroke-width:1.5;stroke-dasharray:7 4}.title{font-size:21px;font-weight:600}.detail{font-size:17px;fill:#425763}.edge{fill:none;stroke:#607783;stroke-width:2;marker-end:url(#arrow)}.note{font-size:16px;fill:#536670}</style><rect width="1440" height="1020" fill="white"/><text x="50" y="53" class="heading">工具调用 · 从发现到执行的权限边界</text><text x="50" y="88" class="subtitle">拟新增统一 ToolGateway；LangChain 与 MCP 只是适配方式，不另设批准逻辑。</text><path class="edge" d="M450 220 H520"/><path class="edge" d="M720 290 V400"/><path class="edge" d="M1190 290 V350 H900 V400"/><path class="edge" d="M450 550 V600 H250 V670"/><path class="edge" d="M720 550 V670"/><path class="edge" d="M990 550 V600 H1190 V670"/><rect x="50" y="150" width="400" height="140" rx="12" class="planned"/><text x="68" y="182" class="title">模型 / LangGraph 节点</text><text x="68" y="214" class="detail">生成候选工具名与参数</text><text x="68" y="239" class="detail">不持有批准和提权能力</text><text x="68" y="264" class="detail">不能自行声明调用范围</text><rect x="520" y="150" width="400" height="140" rx="12" class="planned"/><text x="538" y="182" class="title">LangChain 工具适配</text><text x="538" y="214" class="detail">工具Schema与返回合同</text><text x="538" y="239" class="detail">对接现有能力</text><text x="538" y="264" class="detail">不是第二个执行控制器</text><rect x="990" y="150" width="400" height="140" rx="12" class="planned"/><text x="1008" y="182" class="title">外部 MCP 客户端 · 拟增</text><text x="1008" y="214" class="detail">仅接已配置白名单服务</text><text x="1008" y="239" class="detail">发现后再次筛选允许工具</text><text x="1008" y="264" class="detail">单独核对接收方同意</text><rect x="250" y="400" width="940" height="150" rx="12" class="planned"/><text x="268" y="432" class="title">ToolGateway · 服务器端注册与校验</text><text x="268" y="464" class="detail">核对 Schema、效果、任务 / 数据 / 计划 / 运行归属</text><text x="268" y="489" class="detail">读取批准记录和外发同意；校验超时、预算、幂等引用及工作区路径</text><text x="268" y="514" class="detail">工具描述或返回资料中的指令不能授予新权限</text><rect x="50" y="670" width="400" height="145" rx="12" class="node"/><text x="68" y="702" class="title">只读本地查询</text><text x="68" y="734" class="detail">方法检索、指定运行证据</text><text x="68" y="759" class="detail">无统计副作用</text><text x="68" y="784" class="detail">已有 MCP 服务端仍只读</text><rect x="520" y="670" width="400" height="145" rx="12" class="node"/><text x="538" y="702" class="title">已批准的统计计算</text><text x="538" y="734" class="detail">交由 TaskRuntime 执行</text><text x="538" y="759" class="detail">批准摘要与执行所有权核验</text><text x="538" y="784" class="detail">不经远程协议绕行本地内核</text><rect x="990" y="670" width="400" height="145" rx="12" class="planned"/><text x="1008" y="702" class="title">受限导出 / 外部读取</text><text x="1008" y="734" class="detail">导出仅限工作区核验产物</text><text x="1008" y="759" class="detail">外部调用检查来源与接收配置</text><text x="1008" y="784" class="detail">返回内容仍按不可信资料处理</text><text x="50" y="900" class="note">不向模型开放：接受或批准草案、登记人工事实、修改授权、删除研究数据。</text><text x="50" y="940" class="note">当前 MCP 服务端与未来客户端是不同方向；接入协议本身不会提高统计正确性或结论可读性。</text><text x="50" y="995" class="note">2026-10-31 · 实线框：现有核心；虚线框：建议新增或改造，尚未接入正式流程。</text></svg>
