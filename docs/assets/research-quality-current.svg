<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350"><rect width="1120" height="350" fill="#f6f8fb"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#183544}.title{font-size:23px;font-weight:bold}.main{font-size:18px;font-weight:bold}.sub{font-size:14px}</style><text x="30" y="40" class="title">CausalOps 0.16.0 · 研究质量检查</text><rect x="20" y="82" width="205" height="125" rx="12" fill="white" stroke="#b6c8ce"/><text x="34" y="120" class="main">1. 理解问题</text><text x="34" y="156" class="sub">对象 · 指标 · 比较 · 目标</text><rect x="240" y="82" width="205" height="125" rx="12" fill="white" stroke="#b6c8ce"/><text x="254" y="120" class="main">2. 核对依据</text><text x="254" y="156" class="sub">数据来源 · 时序 · 方法资料</text><rect x="460" y="82" width="205" height="125" rx="12" fill="white" stroke="#b6c8ce"/><text x="474" y="120" class="main">3. 审核计算</text><text x="474" y="156" class="sub">版本绑定 · 人工批准 · 本地估计</text><rect x="680" y="82" width="205" height="125" rx="12" fill="white" stroke="#b6c8ce"/><text x="694" y="120" class="main">4. 解释结果</text><text x="694" y="156" class="sub">基线 · 幅度 · 样本范围</text><rect x="900" y="82" width="205" height="125" rx="12" fill="white" stroke="#b6c8ce"/><text x="914" y="120" class="main">5. 安排下一步</text><text x="914" y="156" class="sub">诊断问题 · 缺失依据 · 新待审计划</text><text x="30" y="257" class="main">每次解释绑定：数据版本 + 研究口径 + 审批 + 运行证据</text><text x="30" y="292" class="sub">质量检查不修改原数据；方法诊断不证明识别假设；普通对话不批准执行；历史结果不被新口径覆盖。</text></svg>