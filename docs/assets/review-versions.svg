<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="800" height="373" viewBox="0 0 800 373"><title id="t">方案修订与批准范围</title><desc id="d">接受修订和批准统计执行是两个动作。历史运行保留原口径。</desc>
<style>text{font-family:Microsoft YaHei,sans-serif;fill:#1c2d3b}.h{font-size:23px;font-weight:bold}.a{font-size:17px}.b{font-size:14px;fill:#405c64}</style>
<rect width="800" height="373" fill="white"/><text x="22" y="36" class="h">方案修订与批准范围</text><path d="M22 54 H778" stroke="#176b65" stroke-width="2"/>
<rect x="22" y="70" width="206" height="44" rx="3" fill="#eff5f4"/><text x="34" y="98" class="a">当前研究方案</text>
<text x="308" y="85" text-anchor="middle" class="b">提出修订</text><path d="M239 96 H377 l-6 -4 M377 96 l-6 4" fill="none" stroke="#527b82"/>
<text x="396" y="99" class="a">待审候选与字段差异</text>
<rect x="22" y="132" width="206" height="44" rx="3" fill="#eff5f4"/><text x="34" y="160" class="a">待审候选</text>
<text x="308" y="147" text-anchor="middle" class="b">使用者接受</text><path d="M239 158 H377 l-6 -4 M377 158 l-6 4" fill="none" stroke="#527b82"/>
<text x="396" y="161" class="a">新的当前方案</text>
<rect x="22" y="194" width="206" height="44" rx="3" fill="#eff5f4"/><text x="34" y="222" class="a">当前方案</text>
<text x="308" y="209" text-anchor="middle" class="b">校验与批准</text><path d="M239 220 H377 l-6 -4 M377 220 l-6 4" fill="none" stroke="#527b82"/>
<text x="396" y="223" class="a">绑定数据与计划版本的执行权限</text>
<rect x="22" y="256" width="206" height="44" rx="3" fill="#eff5f4"/><text x="34" y="284" class="a">已保存运行</text>
<text x="308" y="271" text-anchor="middle" class="b">查看历史</text><path d="M239 282 H377 l-6 -4 M377 282 l-6 4" fill="none" stroke="#527b82"/>
<text x="396" y="285" class="a">该次运行的结果与证据</text>
<text x="22" y="358" class="b">接受修订和批准统计执行是两个动作。历史运行保留原口径。</text>
</svg>
