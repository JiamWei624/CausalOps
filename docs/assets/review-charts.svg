<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="800" height="373" viewBox="0 0 800 373"><title id="t">探索性图表选择</title><desc id="d">常量或有效观测不足时，相关系数显示为未计算。</desc>
<style>text{font-family:Microsoft YaHei,sans-serif;fill:#1c2d3b}.h{font-size:23px;font-weight:bold}.a{font-size:17px}.b{font-size:14px;fill:#405c64}</style>
<rect width="800" height="373" fill="white"/><text x="22" y="36" class="h">探索性图表选择</text><path d="M22 54 H778" stroke="#176b65" stroke-width="2"/>
<rect x="22" y="70" width="206" height="44" rx="3" fill="#eff5f4"/><text x="34" y="98" class="a">单变量分布</text>
<text x="308" y="85" text-anchor="middle" class="b">按字段类型</text><path d="M239 96 H377 l-6 -4 M377 96 l-6 4" fill="none" stroke="#527b82"/>
<text x="396" y="99" class="a">数值分布图或类别频数图</text>
<rect x="22" y="132" width="206" height="44" rx="3" fill="#eff5f4"/><text x="34" y="160" class="a">两个数值变量</text>
<text x="308" y="147" text-anchor="middle" class="b">成对有效值</text><path d="M239 158 H377 l-6 -4 M377 158 l-6 4" fill="none" stroke="#527b82"/>
<text x="396" y="161" class="a">Pearson 与 Spearman 系数图</text>
<rect x="22" y="194" width="206" height="44" rx="3" fill="#eff5f4"/><text x="34" y="222" class="a">三个以上数值变量</text>
<text x="308" y="209" text-anchor="middle" class="b">按变量对</text><path d="M239 220 H377 l-6 -4 M377 220 l-6 4" fill="none" stroke="#527b82"/>
<text x="396" y="223" class="a">Pearson 相关矩阵</text>
<rect x="22" y="256" width="206" height="44" rx="3" fill="#eff5f4"/><text x="34" y="284" class="a">关联回归</text>
<text x="308" y="271" text-anchor="middle" class="b">已保存估计</text><path d="M239 282 H377 l-6 -4 M377 282 l-6 4" fill="none" stroke="#527b82"/>
<text x="396" y="285" class="a">系数及其置信区间</text>
<text x="22" y="358" class="b">常量或有效观测不足时，相关系数显示为未计算。</text>
</svg>
