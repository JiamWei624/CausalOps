<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="895" viewBox="0 0 1280 895" role="img" aria-labelledby="title desc"><title id="title">CausalOps 0.13 · 用户操作流程</title><desc id="desc">常见任务由系统组织；仅在需要业务事实或分析批准时停下来确认。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 Z" fill="#607387"/></marker></defs><style>text{font-family:Microsoft YaHei,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#172c3d}.sub{font-size:17px;fill:#526477}.head{font-size:21px;font-weight:700;fill:#164e4b}.line{font-size:17px;fill:#34485a}</style><rect width="1280" height="895" fill="#f4f7fa"/><text class="title" x="40" y="52">CausalOps 0.13 · 用户操作流程</text><text class="sub" x="40" y="84">常见任务由系统组织；仅在需要业务事实或分析批准时停下来确认。</text><rect x="40" y="112" width="1200" height="118" rx="12" fill="white" stroke="#cbd8df"/><rect x="40" y="112" width="7" height="118" fill="#24776d"/><text class="head" x="65" y="144">01 / 首页连接与上传</text><text class="line" x="65" y="178">选择模型、填写密钥；也可从本地模式开始。</text><text class="line" x="65" y="208">连接配置收起展示；导入后自动显示数据概览与初步建议。</text><path d="M640 232 L640 253" stroke="#607387" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="257" width="1200" height="118" rx="12" fill="white" stroke="#cbd8df"/><rect x="40" y="257" width="7" height="118" fill="#24776d"/><text class="head" x="65" y="289">02 / 理解数据与明确问题</text><text class="line" x="65" y="323">一键基础报告 → 本地描述统计；推荐分析方向 → 问题卡片。</text><text class="line" x="65" y="353">连续请求关联已展示的问题与方案；建议不构成结果或批准。</text><path d="M640 377 L640 398" stroke="#607387" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="402" width="1200" height="118" rx="12" fill="white" stroke="#cbd8df"/><rect x="40" y="402" width="7" height="118" fill="#24776d"/><text class="head" x="65" y="434">03 / 方法依据与待审计划</text><text class="line" x="65" y="468">LangGraph 路由 → LangChain 方法检索 → 数据条件检查 → 计划。</text><text class="line" x="65" y="498">使用者确认自己知道的口径与事实；未知内容不由模型补齐。</text><path d="M640 522 L640 543" stroke="#607387" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="547" width="1200" height="118" rx="12" fill="white" stroke="#cbd8df"/><rect x="40" y="547" width="7" height="118" fill="#24776d"/><text class="head" x="65" y="579">04 / 本地统计与运行证据</text><text class="line" x="65" y="613">批准绑定数据、口径、代码与计划版本；注册工具执行统计。</text><text class="line" x="65" y="643">诊断限制结论等级；保存图表、数值事实、报告与执行记录。</text><path d="M640 667 L640 688" stroke="#607387" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="692" width="1200" height="118" rx="12" fill="white" stroke="#cbd8df"/><rect x="40" y="692" width="7" height="118" fill="#24776d"/><text class="head" x="65" y="724">05 / 解读与继续讨论</text><text class="line" x="65" y="758">结论与保存统计量优先展示；图表、诊断和证据按需展开。</text><text class="line" x="65" y="788">问答引用选定运行，不自动重算；新分析建立新计划。</text></svg>