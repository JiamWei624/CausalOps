<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 352" width="900"><title id="title">一份营销实验报告能够回答什么？</title><desc id="desc">以两周访问率为例，先确认比较范围。同一报告支持访问率差和相对增长；明年净利润需要补充成本、收入和时间资料。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#334b58" stroke-width="1.5"/></marker></defs><style>text{font-family:'Segoe UI','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#182e39}.big{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:650}.note{font-size:16px}.meta{font-size:14px;fill:#3e5965}</style><rect width="900" height="352" fill="white"/><text x="22" y="38" class="big">一封营销邮件，改变了多少访问？</text><text x="22" y="67" class="meta">Hillstrom 公开实验   /   男装邮件组与未发邮件组   /   分配后两周</text><rect x="22" y="95" width="350" height="75" rx="7" fill="#f2f5f7" stroke="#aebec5"/><text x="38" y="125" class="label">确认要比较的两组与指标</text><text x="38" y="151" class="note">同一观察期，访问人数 ÷ 组内人数</text><path d="M375 133 H475" stroke="#334b58" stroke-width="2"  fill="none" marker-end="url(#arr)"/><rect x="481" y="95" width="397" height="75" rx="7" fill="#f2f5f7" stroke="#aebec5"/><text x="499" y="125" class="label">保存本次比较</text><text x="499" y="151" class="note">未发邮件 10.62%     男装邮件 18.28%</text><path d="M681 171 V193 H230 V210" stroke="#334b58" stroke-width="2"  fill="none" marker-end="url(#arr)"/><path d="M681 171 V210" stroke="#334b58" stroke-width="2"  fill="none" marker-end="url(#arr)"/><rect x="22" y="216" width="416" height="109" rx="7" fill="#eaf5f1" stroke="#438274"/><text x="38" y="247" class="label">问访问率提高了多少</text><text x="38" y="275" class="note">绝对差 +7.66 个百分点</text><text x="38" y="301" class="note">相对未发邮件组增长 72.14%</text><rect x="463" y="216" width="415" height="109" rx="7" fill="#fff3df" stroke="#ab7934"/><text x="479" y="247" class="label">问明年净利润增加多少</text><text x="479" y="275" class="note">指标、期间均已改变，转入澄清。</text><text x="479" y="301" class="note">需约定净利润口径，并补充成本与跟踪资料。</text></svg>