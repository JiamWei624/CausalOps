<svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" role="img" aria-labelledby="t d"><title id="t">分析任务与人工审核</title><desc id="d">按行阅读。资料不足时补充口径，批准后才进入统计执行。解释已有结果时读取相应运行。</desc><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#203541}.h{font-size:18px;font-weight:bold}.b{font-size:16px}.s{font-size:14px;fill:#4c606b}</style><rect width="820" height="370" fill="white"/><text x="19" y="31" class="h">分析任务与人工审核</text><rect x="16" y="49" width="788" height="40" fill="#eaf2f2"/><text x="29" y="75" class="h">阶段</text><text x="177" y="75" class="h">使用者操作</text><text x="489" y="75" class="h">工作台响应</text>
<path d="M16 89 H804" stroke="#d5dfe1"/><text x="29" y="121" class="b">01　导入</text><text x="177" y="121" class="b">载入示例或上传 CSV / Parquet</text><text x="489" y="121" class="b">检查字段、缺失值与重复记录</text><path d="M16 141 H804" stroke="#d5dfe1"/><text x="29" y="173" class="b">02　确定问题</text><text x="177" y="173" class="b">选择目标指标，确认观察单位和期间</text><text x="489" y="173" class="b">展示分布或提出分析建议</text><path d="M16 193 H804" stroke="#d5dfe1"/><text x="29" y="225" class="b">03　审核计划</text><text x="177" y="225" class="b">核对分组、指标与方法，批准执行</text><text x="489" y="225" class="b">资料不足时列出待补事项</text><path d="M16 245 H804" stroke="#d5dfe1"/><text x="29" y="277" class="b">04　查看结果</text><text x="177" y="277" class="b">核对估计值、单位、区间及解释限制</text><text x="489" y="277" class="b">保存本次运行、诊断和报告</text><path d="M16 297 H804" stroke="#d5dfe1"/><text x="29" y="329" class="b">05　复核或修订</text><text x="177" y="329" class="b">追问已有结果，或提出新的分析问题</text><text x="489" y="329" class="b">引用原运行；口径变化时另拟计划</text></svg>
