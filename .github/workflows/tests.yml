name: Windows Python 3.11 validation
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-runtime-win-py311.txt
      - run: python -m pip install --no-deps .
      - name: Download verified public Hillstrom fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'hillstrom.csv.gz'
          Invoke-WebRequest -Uri 'https://hillstorm1.s3.us-east-2.amazonaws.com/hillstorm_no_indices.csv.gz' -OutFile $fixture
          if ((Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash.ToLower() -ne 'bab6578f60db5d792f1c2372c502f029152a5249cf5ea84390f3b7f885d7234f') { throw 'Public fixture fingerprint mismatch' }
          "CAUSALOPS_HILLSTROM_ARCHIVE=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python -m pytest --basetemp test-temp
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '2'
      - run: python scripts/verify_assistant_mcp.py --workspace mcp-test-workspace --out mcp-test-result.json
        env:
          PYTHONDONTWRITEBYTECODE: '1'
