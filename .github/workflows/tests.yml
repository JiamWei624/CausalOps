name: Windows Python 3.11 validation
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-runtime-win-py311.txt
      - run: python -m pip install --no-deps .
      - run: python -m pytest --basetemp test-temp
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '2'
