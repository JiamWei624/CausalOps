[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalops-agent"
version = "0.15.1"
description = "Evidence-gated causal analytics and decision agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas>=2.3,<3",
  "numpy>=2,<3",
  "duckdb>=1.4",
  "sqlglot>=30",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<0.29",
  "jsonschema>=4.23,<5",
  "statsmodels>=0.14",
  "scikit-learn>=1.6",
  "linearmodels>=7",
  "doubleml>=0.11.4,<0.12",
  "scipy>=1.15,<1.16",
  "plotly>=6",
]

[project.optional-dependencies]
workflow = ["langgraph==1.2.19", "langgraph-checkpoint-sqlite==3.1.3", "langchain-core==1.7.3"]
app = ["streamlit>=1.66,<2", "pyarrow>=20"]
mcp = ["mcp==2.3.0"]
research = ["dowhy>=0.14"]
extensions = ["differences==0.3.0", "rdrobust==2.1.1"]
a2a = ["a2a-sdk[http-server]==1.3.0", "uvicorn>=0.30"]
llm = ["openai>=3.39,<4"]
dev = ["pytest>=9", "pytest-cov>=7", "pytest-asyncio>=1"]

[project.scripts]
causalops = "causalops.cli:main"
causalops-workbench = "causalops.launch:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"


[tool.setuptools.package-data]
"causalops.knowledge" = ["catalog.json"]

"causalops.sample_data" = ["*.csv", "*.json"]

"causalops.help" = ["manual.html"]
